.coverage{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:14px 0}

/* Light professional operations theme */

/* Vocabulary alignment repair */
.vocab-grid{
  display:grid !important;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr)) !important;
  gap:18px !important;
  align-items:stretch !important;
}
.flip{
  min-height:310px !important;
  height:auto !important;
  margin:0 !important;
  perspective:1000px;
}
.flip-inner{
  position:relative !important;
  width:100% !important;
  min-height:310px !important;
  height:100% !important;
}
.flip-front,.flip-back{
  box-sizing:border-box !important;
  width:100% !important;
  min-height:310px !important;
  padding:22px !important;
  border:1px solid var(--line) !important;
  border-radius:8px !important;
  overflow:auto !important;
}
.flip-front{
  display:flex !important;
  flex-direction:column !important;
  align-items:flex-start !important;
  justify-content:center !important;
  text-align:left !important;
}
.flip-back{
  display:block !important;
  text-align:left !important;
}
.flip-front h3,.flip-front strong,.flip-back h3{
  margin-top:0 !important;
}
.vocab-detail{
  width:100% !important;
  box-sizing:border-box !important;
  font-size:14px !important;
  line-height:1.58 !important;
  margin:0 !important;
  padding:0 !important;
}
.vocab-detail strong{
  display:inline !important;
  color:#167fa6 !important;
}
.vocab-detail code{
  white-space:normal !important;
  overflow-wrap:anywhere !important;
}
#vocab .activity{
  overflow:visible !important;
}
@media(max-width:700px){
  .vocab-grid{grid-template-columns:1fr !important}
  .flip,.flip-inner,.flip-front,.flip-back{min-height:280px !important}
  .flip-front,.flip-back{padding:18px !important}
}

{id:'welcome',label:'Welcome',phase:'Foundation',html:`<div class="kicker">Aegis Harbor Operations Center · Search Analyst Qualification</div><h1>Trace the signal. Explain what changed.</h1><div class="folio"><div><p class="lead">You are joining Aegis Harbor's Search Operations team. Before the live workshop, your task is to learn how Splunk fields organize event data and how SPL pipelines reshape search results. This prework stays deliberately at <b>Remember → Understand</b>: recognize the language first, then explain what changes and why.</p><div class="meta"><div><b>Role</b>Search Operations Analyst</div><div><b>Journey</b>Reporter → Translator</div><div><b>Estimated time</b>~60+ minutes</div></div><button class="btn" onclick="go(1)">Enter operations →</button></div><div class="paper"><span class="stamp">Qualification file 200.3–200.4</span><h3 style="margin-top:18px">Your assignment</h3><p>Complete the full instructional sequence from Lessons 200.3 and 200.4: field creation and discovery, all three search modes, Fields Sidebar and Field Window behavior, precise field filtering, wildcards, Boolean/comparison logic, table/rename, the search pipeline, and the detailed behavior of <code>fields</code>, <code>dedup</code>, <code>sort</code>, and <code>eval</code> including every demonstrated eval function.</p><p class="tiny">No live Splunk instance is required. Your responses remain in this browser session.</p></div></div>`},
{id:'objectives',label:'Objectives',phase:'Foundation',html:`<div class="kicker">Opening foundation · 02</div><h2>Learning objectives</h2><div class="paper"><p class="lead">By the end of this prework, you should be able to explain the core field model and search pipeline in your own words.</p><ul class="objectives"><li><b>Explain fields</b>, including indexed fields, search-time fields, internal/event fields, and how search modes affect field discovery.</li><li><b>Recognize how to use the Fields Sidebar</b>: Selected Fields, Interesting Fields, All Fields, field windows, values, counts, types, and report options.</li><li><b>Describe how fields refine searches</b> using field/value pairs, exact phrases, wildcards, Boolean and comparison operators, <code>table</code>, and <code>rename</code>.</li><li><b>Describe the SPL search pipeline</b> and how output from one command becomes input to the next.</li><li><b>Recognize and explain</b> the basic purposes and important behavior of <code>fields</code>, <code>dedup</code>, <code>sort</code>, and <code>eval</code>.</li></ul></div>`},
{id:'vocab',label:'Vocabulary',phase:'Foundation',html:`<div class="kicker">Opening foundation · 03</div><h2>Essential vocabulary</h2><p class="lead"><div class="instructionbox"><b>How to use this vocabulary deck:</b><br>
1. Read the term and explain what you think it means before opening the card.<br>
2. Click the card to reveal the complete explanation.<br>
3. Compare your thinking with the definition, why it matters, examples, and recognition clues.<br>
4. Focus on how the concept changes what Splunk searches, returns, transforms, or displays.<br>
5. Click the expanded card again to return to the term.</div></p><div class="cards" id="cards"></div>`},
{
id:'rbrief',label:'Signal Brief',phase:'SIGNAL ANALYST · REMEMBER',html:`<div class="kicker">SIGNAL ANALYST · REMEMBER</div>
<h2>Signal Brief</h2>
<p class="lede">Before you interpret searches, you need a reliable mental inventory of the pieces Splunk uses. This phase is about <b>recognition and recall</b>: seeing a term, symbol, field behavior, or command and knowing what it represents before you are asked to reason through a larger search.</p>

<div class="instructionbox"><b>Your role:</b> You are a Search Operations Analyst at Aegis Harbor. A new set of Splunk searches is being prepared for analyst use. Your first responsibility is not to troubleshoot or optimize them yet. Your responsibility is to recognize the building blocks accurately so that later interpretation is based on the correct meaning.</div>

<div class="refgrid">
  <div class="refcard"><h3>01 · Recognize fields</h3>
  <p>A <b>field</b> is a searchable name/value pair such as <code>status=200</code>. Be ready to distinguish fields that already exist at index time from fields extracted or created at search time.</p>
  <p class="mini"><b>Remember:</b> <code>host</code>, <code>source</code>, <code>sourcetype</code>, and <code>index</code> are important default/index-time fields discussed in the lesson.</p></div>

  <div class="refcard"><h3>02 · Recognize search modes</h3>
  <p><b>Fast</b> prioritizes speed and limits field discovery. <b>Verbose</b> prioritizes completeness and returns all extracted fields plus the event list and timeline. <b>Smart</b> is the default and adjusts its behavior based on the type of search.</p>
  <p class="mini"><b>Memory cue:</b> Fast = speed, Verbose = completeness, Smart = balance.</p></div>

  <div class="refcard"><h3>03 · Read the Fields Sidebar</h3>
  <p><b>Selected Fields</b> are displayed with events. <b>Interesting Fields</b> occur in at least 20% of returned events. <b>All Fields</b> exposes the broader field set.</p>
  <p class="mini"><b>Visual clues:</b> α = alphanumeric, # = numeric, and the number beside a field represents its unique-value count.</p></div>

  <div class="refcard"><h3>04 · Recognize precise search syntax</h3>
  <p>Field/value searches are more precise than loose text searches. Quotation marks preserve exact phrases. <code>*</code> is the wildcard. Boolean operators <code>AND</code>, <code>OR</code>, and <code>NOT</code> are uppercase, and AND can be implied between terms.</p>
  <p class="mini"><b>Example:</b> Searching only <code>503</code> can match multiple contexts; <code>status=503</code> identifies the intended field.</p></div>

  <div class="refcard"><h3>05 · Recognize the SPL pipeline</h3>
  <p>The pipe <code>|</code> passes the current results into the next command. Think of the search as a sequence: retrieve events → pass results forward → transform the current result set → pass the new result forward again.</p>
  <p class="mini"><b>Key idea:</b> Every command receives the output produced by the stage before it.</p></div>

  <div class="refcard"><h3>06 · Know the command jobs</h3>
  <p><code>fields</code> controls which fields are carried forward. <code>dedup</code> removes repeated field-value combinations. <code>sort</code> orders results. <code>eval</code> calculates values and creates or overwrites search-result fields.</p>
  <p class="mini"><b>Do not overthink yet:</b> In this phase, identify what each command is designed to do. Deeper behavior comes in the Interpretation phase.</p></div>
</div>

<div class="coverage">
 <div><b>What you will do</b>Classify concepts, identify accurate syntax, recognize field/search-mode behavior, and put the search pipeline in the correct sequence.</div>
 <div><b>What you are NOT doing yet</b>You are not investigating an incident, choosing a response, or evaluating the best operational solution. Those require higher-level reasoning.</div>
 <div><b>How to approach each activity</b>Read every option. Look for the exact Splunk behavior being described. Similar-looking terms are intentionally separated so you build precise recall.</div>
</div>

<div class="good"><b>Success looks like this:</b> By the end of the Signal phase, you should be able to see a Splunk term or basic syntax pattern and explain its purpose in one clear sentence without guessing from the wording of the answer choices.</div>

<div class="warn"><b>Common confusion to watch for:</b> “Indexed” does not mean every field you can search. “Interesting” does not mean important. <code>NOT field=value</code> and <code>field!=value</code> do not handle missing fields the same way. A pipe does not start a new independent search—it passes the current results forward.</div>

<div class="activity">
 <h3>Before you continue</h3>
 <p>Use these four questions as a mental check:</p>
 <ol>
   <li>Can I explain the difference between an indexed field and a search-time field?</li>
   <li>Can I identify Fast, Smart, and Verbose mode from their behavior?</li>
   <li>Can I explain what the pipe does in a search pipeline?</li>
   <li>Can I state the basic purpose of <code>fields</code>, <code>dedup</code>, <code>sort</code>, and <code>eval</code>?</li>
 </ol>
 <p class="mini">You do not need perfect command syntax yet. The upcoming Reporter activities will reinforce the details before the application moves into understanding and interpretation.</p>
</div>`},
{id:'reporter1',label:'Reporter 01 · Fields',phase:'SIGNAL ANALYST · REMEMBER',html:`<div class="kicker">SIGNAL RECORD · 01</div><h2>Field Registry · Evidence Intake</h2>
<p class="lede">Aegis Harbor has received a mixed intake sheet from several Splunk searches. Before the records can be used downstream, classify each observation according to what it actually tells you about Splunk.</p>
<div class="instructionbox"><b>Your assignment:</b> Review all eight evidence records before validating. For each record, choose the <b>most precise classification</b>. Several choices are intentionally related, so do not match by one familiar keyword. Ask: <em>What exact Splunk behavior is this evidence describing?</em> You may revise choices until you select <b>Validate Registry</b>.</div>
<div class="coverage"><div><b>1 · Read</b>Identify the behavior described, not just a familiar term.</div><div><b>2 · Distinguish</b>Decide whether the evidence concerns extraction timing, search-mode behavior, or sidebar classification.</div><div><b>3 · Commit</b>Complete all eight records before validation. The audit explains both the correct classification and why nearby choices do not fit.</div></div>
<div class="artifact"><b>Operations context</b><br>The intake combines web, authentication, and system-search observations. Some describe fields available before searching, some describe fields discovered while searching, and others describe how Splunk presents fields or controls search completeness.</div>
<div id="registry"></div><button class="primary" onclick="validateRegistryEnhanced()">Validate Registry</button><div id="regfb" class="feedback"></div>`},
{
id:'reporter2',label:'Reporter 02 · Search Syntax',phase:'SIGNAL ANALYST · REMEMBER',html:`<div class="kicker">SIGNAL RECORD · 02</div>
<h2>Syntax Proof Sheet · Search Quality Review</h2>
<p class="lede">Aegis Harbor is preparing a set of Splunk search notes for junior analysts. Several statements look plausible, but only one interpretation in each review ticket precisely matches the lesson. Your job is to certify the syntax guidance before it reaches the team.</p>

<div class="instructionbox"><b>Your assignment:</b> Work through all eight review tickets. Each ticket contains closely related interpretations—not simple true/false choices. Read every option before selecting the <b>most accurate explanation</b>. Look for small details involving case sensitivity, exact phrases, wildcard placement, Boolean logic, exclusion behavior, and temporary field naming. After you answer, the Proof Audit explains <b>why the correct option fits and why every competing option does not</b>.</div>

<div class="coverage">
<div><b>Inspect</b>Read the search statement and identify exactly what behavior is being tested.</div>
<div><b>Distinguish</b>Compare the choices carefully. Some contain one true idea but reach the wrong conclusion.</div>
<div><b>Certify</b>Select the best interpretation. Feedback appears immediately so you can correct your mental model before moving on.</div>
</div>

<div class="artifact"><b>Search Quality Standard</b><br>
Do not approve a statement because it “sounds like Splunk.” Certify only the explanation that matches the lesson's exact rule. In production search work, small syntax differences can change what events are returned.</div>

<div class="good"><b>Challenge design:</b> The choices are intentionally similar in length and wording. Do not use answer length as a clue—look for the one technical distinction that changes the Splunk behavior.</div><div id="syntaxproof"></div>`},
{id:'reporter3',label:'Reporter 03 · Pipeline',phase:'SIGNAL ANALYST · REMEMBER',html:`<div class="kicker">SIGNAL RECORD · 03</div>
<h2>Search Relay Simulator · You Are the Pipe</h2>
<p class="lede">Your job is simple: <b>take the result produced by one SPL stage and physically hand that result to the next stage.</b> You are not building syntax and you are not guessing definitions. You are learning what the pipe <code>|</code> does by acting as the pipe.</p>

<div class="mission-card">
 <div class="mission-num">YOUR MISSION</div>
 <p>A supervisor needs this answer: <b>“Which users appear most often in syslog ERROR events, without showing the percent column?”</b></p>
 <div class="mission-path"><span>1 · FIND the right events</span><b>→</b><span>2 · SUMMARIZE users</span><b>→</b><span>3 · REMOVE percent</span></div>
</div>

<div class="instructionbox"><b>How to play:</b> You will complete three short workstations. At each workstation, press the command’s <b>RUN</b> button, inspect the output tray, then press <b>HAND OUTPUT TO NEXT STAGE</b>. The next workstation cannot run until you deliver the previous output. Watch the record count and columns change as the same result set travels through the search.</div>

<div class="relay-progress"><div id="rp1" class="rp active">01<br><span>FIND</span></div><div class="rp-line"></div><div id="rp2" class="rp">02<br><span>SUMMARIZE</span></div><div class="rp-line"></div><div id="rp3" class="rp">03<br><span>CLEAN</span></div></div>

<div class="relay-station" id="rs1">
 <div class="station-head"><span>WORKSTATION 01 · FIND</span><span class="status-pill" id="rs1status">READY</span></div>
 <h3>Find only syslog ERROR events</h3>
 <p class="station-task"><b>What you are doing:</b> Before Splunk runs the search, <b>you make the call</b>. Click the event rows you believe will survive <code>sourcetype=syslog ERROR</code>, then validate your selection. After that, run the real search and compare your judgment with Splunk's output.</p>
 <div class="interaction-prompt"><b>YOUR TURN · Event Triage</b><span>Select every event that should survive the base search.</span></div>
 <div id="triageEvents"></div>
 <div class="station-actions"><button class="secondary" onclick="checkRelayTriage()">Validate My Selection</button><span id="triageScore" class="mini"></span></div>
 <div id="triageFeedback"></div>
 <div class="command-strip"><code>sourcetype=syslog ERROR</code><button id="run1btn" disabled onclick="relayRun1()">RUN SPLUNK SEARCH</button></div>
 <div id="tray1" class="output-tray"></div>
 <button id="handoff1" class="handoff-btn hidden" onclick="relayHandoff1()">HAND THIS OUTPUT TO <code>top user</code> →</button>
</div>

<div class="relay-station locked-station" id="rs2">
 <div class="station-head"><span>WORKSTATION 02 · SUMMARIZE</span><span class="status-pill" id="rs2status">WAITING FOR INPUT</span></div>
 <h3>Turn event rows into a user summary</h3>
 <p class="station-task"><b>What you are doing:</b> The events you hand off become this command’s input. Before running <code>top user</code>, use the received rows to build your own expected summary.</p>
 <div class="input-receipt" id="receipt2">No input received yet.</div>
 <div class="interaction-prompt"><b>YOUR TURN · Build the Expected Output</b><span>Enter how many times each user appears in the input you received.</span></div>
 <div class="count-builder"><label>Maya count <input id="mayaCount" type="number" min="0" max="9" inputmode="numeric"></label><label>Devon count <input id="devonCount" type="number" min="0" max="9" inputmode="numeric"></label><button class="secondary" onclick="checkUserCounts()">Check My Summary</button></div>
 <div id="countFeedback"></div>
 <div class="command-strip"><code>top user</code><button id="run2" disabled onclick="relayRun2()">RUN COMMAND</button></div>
 <div id="tray2" class="output-tray"></div>
 <button id="handoff2" class="handoff-btn hidden" onclick="relayHandoff2()">HAND THIS OUTPUT TO <code>fields - percent</code> →</button>
</div>

<div class="relay-station locked-station" id="rs3">
 <div class="station-head"><span>WORKSTATION 03 · CLEAN</span><span class="status-pill" id="rs3status">WAITING FOR INPUT</span></div>
 <h3>Remove one field from the current results</h3>
 <p class="station-task"><b>What you are doing:</b> Keep the user counts, but remove the <code>percent</code> field from the table you received. First, tell the pipeline which field should be removed.</p>
 <div class="input-receipt" id="receipt3">No input received yet.</div>
 <div class="interaction-prompt"><b>YOUR TURN · Field Control</b><span>Click the column that <code>fields - percent</code> will remove.</span></div>
 <div class="field-picker"><button onclick="pickRelayField('user',this)">user</button><button onclick="pickRelayField('count',this)">count</button><button onclick="pickRelayField('percent',this)">percent</button></div>
 <div id="fieldFeedback"></div>
 <div class="command-strip"><code>fields - percent</code><button id="run3" disabled onclick="relayRun3()">RUN COMMAND</button></div>
 <div id="tray3" class="output-tray"></div>
</div>

<div id="relayDebrief"></div>`},
{id:'tbrief',label:'Interpretation Brief',phase:'TRANSLATOR · UNDERSTAND',html:`<div class="kicker">TRANSLATOR PHASE · UNDERSTAND</div>
<h2>Interpretation Brief · From Syntax to Meaning</h2>
<p class="lede">You have identified the major Splunk fields, search rules, and pipeline components. Now the goal changes: instead of only recognizing a command, explain <b>what it means, what happens to the results, and why an analyst would use it.</b></p>
<div class="instructionbox"><b>Your role:</b> Act as the interpreter between SPL syntax and analyst meaning. For every search element, ask: <b>What is Splunk being told to do? What changes in the current result set? What should the analyst understand from the output?</b> You are explaining behavior and relationships—not designing a new investigation.</div>
<div class="interpret-map">
<div class="interpret-step"><span>01</span><div><b>READ THE SYNTAX</b><p>Identify the field, value, operator, command, or function. Do not ignore quotes, <code>*</code>, <code>!=</code>, <code>-</code>, or <code>|</code>; these can change the meaning.</p></div></div>
<div class="interpret-arrow">→</div>
<div class="interpret-step"><span>02</span><div><b>TRANSLATE THE BEHAVIOR</b><p>Put the SPL into plain language. Explain what Splunk will retrieve, include, exclude, rename, sort, summarize, calculate, or remove.</p></div></div>
<div class="interpret-arrow">→</div>
<div class="interpret-step"><span>03</span><div><b>FOLLOW THE RESULTS</b><p>Ask what the result set looks like afterward. Did events change? Did fields change? Was a field created? Did the same results simply move into a different order?</p></div></div>
</div>
<div class="concept-lens"><h3>Your Interpretation Lenses</h3><div class="lens-grid">
<div class="lens-card"><b>FIELD + VALUE</b><code>status=503</code><p>“Return results where <code>status</code> has the value <code>503</code>.” This is more precise than searching for <code>503</code> alone because that number could occur in another field.</p></div>
<div class="lens-card"><b>EXACT PHRASE</b><code>product_name="Dream Crusher"</code><p>Quotation marks keep the multiword value together as an exact phrase rather than treating the words independently.</p></div>
<div class="lens-card"><b>WILDCARD</b><code>status="fail*"</code><p>The known prefix is <code>fail</code>; <code>*</code> represents additional characters after it. This can match related values such as failed or failure.</p></div>
<div class="lens-card"><b>EXCLUSION</b><code>field!=value</code><p>The field must exist and its value must differ. This is not identical to <code>NOT field=value</code>, which can retain events where the field is absent.</p></div>
<div class="lens-card"><b>PIPE</b><code>search | command</code><p>Read the pipe as “hand the current output to the next command.” The command on the right works on what the stage on the left produced.</p></div>
<div class="lens-card"><b>FIELDS</b><code>fields - percent</code><p>The minus sign excludes the named field from current results. It does not delete indexed data.</p></div>
<div class="lens-card"><b>DEDUP</b><code>dedup user</code><p>Remove repeated results based on the specified field. Which event remains depends on result order.</p></div>
<div class="lens-card"><b>SORT</b><code>sort - count</code><p>The minus sign indicates descending order. Sorting changes result order; it does not automatically remove duplicates.</p></div>
<div class="lens-card"><b>EVAL</b><code>eval result=...</code><p><code>eval</code> calculates or assigns a search-result field. It can create or overwrite a field for the current search without changing indexed source data.</p></div>
</div></div>
<div class="before-after-box"><h3>Use the “Before → Command → After” Method</h3><p>When a command feels confusing, picture the result set before and after the command instead of memorizing only its definition.</p>
<div class="before-after-example"><div><b>BEFORE</b><br><code>user · count · percent</code></div><div class="big-arrow">→</div><div><b>COMMAND</b><br><code>fields - percent</code></div><div class="big-arrow">→</div><div><b>AFTER</b><br><code>user · count</code></div></div>
<p class="mini"><b>Interpretation:</b> The command removed <code>percent</code> from the current results. It did not delete events, modify the index, or restart the search.</p></div>
<div class="watch-box"><b>Common interpretation traps</b><br>Do not confuse <b>removing a field</b> with removing an event; <b>sorting</b> with filtering; <b>renaming</b> with permanently changing indexed data; <b>eval</b> with modifying source data; or <code>!=</code> with <code>NOT field=value</code>.</div>
<div class="good"><b>Success check:</b> A strong explanation sounds like: <em>“This command receives these results, performs this action, and leaves the result set looking like this.”</em></div>`},
{id:'translator1',label:'Translator 01 · Field Logic',phase:'Translator · Understand',html:`<div class="kicker">INTERPRETATION RECORD · 01</div>
<h2>Search Meaning Lab · Exclusion Evidence Board</h2>
<p class="lede">Two searches look almost interchangeable, but they do <b>not</b> treat events with a missing <code>src_ip</code> the same way. Instead of choosing a prepared answer, build the result of each search yourself and then compare them.</p>
<div class="instructionbox"><b>What you do:</b> Work one event at a time. For each search lane, click the event IDs you believe would be returned. When you validate a lane, the evidence board explains <b>every event</b>—why it is returned or excluded. Complete both lanes to unlock the side-by-side interpretation.</div>

<div class="meaning-dataset">
 <div class="meaning-title"><b>Evidence Set · 5 events</b><span>Focus on whether <code>src_ip</code> exists before interpreting the exclusion.</span></div>
 <table class="dataset"><tr><th>ID</th><th>src_ip</th><th>status</th><th>Field state</th></tr>
 <tr><td><b>E1</b></td><td>211.166.11.101</td><td>200</td><td><span class="exists">src_ip exists</span></td></tr>

{id:'translator2',label:'Translator 02 · Pipeline',phase:'Translator · Understand',html:`<div class="kicker">INTERPRETATION RECORD · 02</div>
<h2>Pipeline Transformation Ledger · Result Set Workbench</h2>
<p class="lede">A Splunk pipeline is not four unrelated commands. Each stage receives the current result set, changes something about it, and hands that new version forward. Your job is to reconstruct those transformations.</p>

<div class="instructionbox"><b>What you do:</b> Start with the incoming events below. At each stage, first <b>predict what will change</b>, then run the stage and inspect the actual output. You will work with the data itself rather than choosing a description from a list. The ledger records exactly what changed—and what did not.</div>

<div class="pipeline-console">
 <div class="pipeline-source">
  <div class="console-label">INCOMING WEB EVENTS</div>
  <table class="dataset"><tr><th>Event</th><th>clientip</th><th>uri_path</th><th>status</th></tr>
   <tr><td>W1</td><td>74.64.12.9</td><td>/checkout</td><td>500</td></tr>
   <tr><td>W2</td><td>10.4.2.8</td><td>/login</td><td>200</td></tr>
   <tr><td>W3</td><td>74.64.12.9</td><td>/cart</td><td>500</td></tr>
   <tr><td>W4</td><td>211.166.11.101</td><td>/account</td><td>500</td></tr>
   <tr><td>W5</td><td>10.4.2.8</td><td>/checkout</td><td>500</td></tr>
  </table>
 </div>

 <div class="ledger-stage" id="plStage1"><div class="stage-number">01</div><div class="stage-body">
  <div class="stage-command"><span>RETRIEVE</span><code>index=web status=500</code></div>
  <p><b>Prediction:</b> Which incoming events should remain after this search?</p>
  <div id="plPick1" class="event-picks"></div>
  <button class="primary" onclick="checkPL1()">Validate Prediction & Run Stage</button>
  <div id="plFeedback1"></div>
 </div></div>

 <div class="ledger-stage locked-stage" id="plStage2"><div class="stage-number">02</div><div class="stage-body">
  <div class="stage-command"><span>SHAPE FIELDS</span><code>fields clientip uri_path status</code></div>
  <div id="plInput2" class="handoff-receipt">Waiting for Stage 1 output…</div>
  <p><b>Prediction:</b> This command controls which fields continue forward. Click the field that should <b>not</b> appear in the resulting table.</p>
  <div class="field-control" id="plFields2"><button onclick="pickPLField('Event',this)">Event</button><button onclick="pickPLField('clientip',this)">clientip</button><button onclick="pickPLField('uri_path',this)">uri_path</button><button onclick="pickPLField('status',this)">status</button></div>
  <button id="plRun2" class="primary" disabled onclick="runPL2()">Run Stage 2</button><div id="plFeedback2"></div>
 </div></div>

 <div class="ledger-stage locked-stage" id="plStage3"><div class="stage-number">03</div><div class="stage-body">
  <div class="stage-command"><span>REMOVE DUPLICATES</span><code>dedup clientip</code></div>
  <div id="plInput3" class="handoff-receipt">Waiting for Stage 2 output…</div>

 </div></div>

 <div class="ledger-stage locked-stage" id="plStage4"><div class="stage-number">04</div><div class="stage-body">
  <div class="stage-command"><span>ORDER</span><code>sort - clientip</code></div>
  <div id="plInput4" class="handoff-receipt">Waiting for Stage 3 output…</div>
  <p><b>Prediction:</b> The minus sign means descending order. Arrange your expected first and last IP by selecting them below.</p>
  <div class="sort-predict"><label>First <select id="plFirst"><option value="">Select…</option><option>74.64.12.9</option><option>211.166.11.101</option><option>10.4.2.8</option></select></label><label>Last <select id="plLast"><option value="">Select…</option><option>74.64.12.9</option><option>211.166.11.101</option><option>10.4.2.8</option></select></label></div>

{id:'translator3',label:'Translator 03 · eval',phase:'Translator · Understand',html:`<div class="kicker">INTERPRETATION RECORD · 03</div>
<h2>Eval Interpretation Desk · Expression Trace Console</h2>
<p class="lede"><code>eval</code> becomes much easier when you stop treating it as a definition and instead <b>trace what the expression does to each search result</b>. In this desk, you will predict outputs, inspect transformations, and separate search-time changes from indexed data.</p>
<div class="instructionbox"><b>How to work the desk:</b> Complete three interpretation cases. Each case gives you existing search results and an <code>eval</code> expression. Make your prediction first, then run the expression. Feedback explains the correct reasoning and the tempting misconceptions—not just whether you were right.</div>

<div class="eval-case" id="ec1">
 <div class="eval-case-head"><span>CASE 01 · CONDITIONAL FIELD</span><code>| eval error=if(status=200,"OK","Problem")</code></div>
 <p><b>Your task:</b> Trace the condition across all three events. For each row, choose the value you expect the new <code>error</code> field to contain.</p>
 <table class="eval-trace"><tr><th>Event</th><th>status</th><th>Predicted error</th></tr>
 <tr><td>A1</td><td>200</td><td><select id="ec1a"><option value="">Select…</option><option>OK</option><option>Problem</option><option>200</option></select></td></tr>
 <tr><td>A2</td><td>404</td><td><select id="ec1b"><option value="">Select…</option><option>Problem</option><option>404</option><option>OK</option></select></td></tr>
 <tr><td>A3</td><td>500</td><td><select id="ec1c"><option value="">Select…</option><option>500</option><option>OK</option><option>Problem</option></select></td></tr></table>
 <button class="primary" onclick="checkEvalCase1()">Run Expression Trace</button><div id="ec1fb"></div>
</div>

<div class="eval-case locked-stage" id="ec2">
 <div class="eval-case-head"><span>CASE 02 · EXISTING FIELD</span><code>| eval category=lower(category)</code></div>
 <p>The incoming result already contains <code>category="SECURITY"</code>. What does the result look like after <code>eval</code> writes back to the same field name?</p>
 <div class="before-result"><div><b>BEFORE</b><code>category = "SECURITY"</code></div><div class="big-arrow">→</div><div><b>BUILD THE AFTER STATE</b><div class="eval-options" id="ec2opts">
  <button onclick="pickEval2(0,this)"><code>category = "security"</code><span>The current result field is overwritten.</span></button>
  <button onclick="pickEval2(1,this)"><code>category = "SECURITY"</code><span>The original result value remains unchanged.</span></button>
  <button onclick="pickEval2(2,this)"><code>category_lower = "security"</code><span>A separate field is automatically created.</span></button>
  <button onclick="pickEval2(3,this)"><code>category = "security"</code><span>The indexed source value is permanently replaced.</span></button>
 </div></div></div><div id="ec2fb"></div>
</div>

<div class="eval-case locked-stage" id="ec3">
 <div class="eval-case-head"><span>CASE 03 · FUNCTION MEANING</span><code>pow() · tostring() · strftime() · if() · case() · lower() · cidermatch()</code></div>
 <p><b>Your task:</b> Pair each analyst need with the function that represents that meaning. Each function can be used once.</p>
 <div class="function-grid">
  <label>Convert <code>categoryId</code> text to lowercase<select id="ef1"><option value="">Choose function…</option><option>strftime()</option><option>cidermatch()</option><option>lower()</option><option>tostring()</option></select></label>
  <label>Render UNIX seconds as formatted date/time text<select id="ef2"><option value="">Choose function…</option><option>lower()</option><option>tostring()</option><option>strftime()</option><option>pow()</option></select></label>
  <label>Determine whether an IP belongs to a CIDR network<select id="ef3"><option value="">Choose function…</option><option>case()</option><option>cidermatch()</option><option>strftime()</option><option>if()</option></select></label>
  <label>Convert a value to a string, including supported formats<select id="ef4"><option value="">Choose function…</option><option>pow()</option><option>lower()</option><option>tostring()</option><option>case()</option></select></label>
 </div>
 <button class="primary" onclick="checkEvalCase3()">Validate Function Map</button><div id="ec3fb"></div>
</div>
<div id="evalDeskSummary"></div>`},
{id:'translator4',label:'Translator 04 · Efficiency',phase:'Translator · Understand',html:`<div class="kicker">INTERPRETATION RECORD · 04</div>
<h2>Efficiency & Presentation Notes · Search Review Desk</h2>
<p class="lede">A search can be logically valid and still be broader, less precise, or harder to interpret than necessary. At this desk, you will review four analyst notes and <b>diagnose the meaning of each search choice</b> before opening the expert review.</p>
<div class="instructionbox"><b>Your workflow:</b> Read the analyst note and inspect the SPL. Then choose the interpretation that best explains the behavior—not merely the option containing a familiar keyword. The alternatives are intentionally plausible. After you commit, the review explains <b>why every interpretation is right or wrong</b> and gives you the source lesson's recognition rule.</div>

<div class="review-desk" id="effDesk"></div>
<div id="effSummary"></div>`},
{
id:'filterlab',label:'Translator 05 · Search Precision',phase:'Translator · Understand',html:`<div class="kicker">INTERPRETATION RECORD · 05</div>
<h2>Search Precision & Filtering Lab · Query Tuning Bench</h2>
<p class="lede">Small syntax choices can make a Splunk search more precise, broader than intended, or subtly different in meaning. At this bench, you will <b>tune searches against a concrete analyst intent</b> and then inspect exactly how each alternative behaves.</p>

<div class="instructionbox"><b>Your workflow:</b> Each tuning ticket gives you an analyst intent and several believable search expressions. Read all of them before choosing. The alternatives deliberately use valid-looking SPL, so keyword recognition alone will not be enough. After you commit, an <b>Expert Query Audit</b> explains the correct search and every distractor.</div>

<div class="precision-console">
 <div class="precision-rules">
  <div><b>PRECISION</b><span>Name the field when you know which attribute matters.</span></div>
  <div><b>PHRASES</b><span>Quotes preserve an exact multiword value.</span></div>
  <div><b>WILDCARDS</b><span><code>*</code> represents unlimited characters; placement matters.</span></div>
  <div><b>BOOLEAN</b><span><code>AND OR NOT</code> are uppercase; AND is implied between terms.</span></div>
  <div><b>COMPARISON</b><span>Operators express value relationships and ranges.</span></div>
 </div>
 <div class="precision-workflow"><b>INTERACTIVE TUNING LOOP</b><span>Inspect intent</span><i>→</i><span>Test candidate searches</span><i>→</i><span>Commit one query</span><i>→</i><span>Audit behavior</span></div>
 <div id="precisionTickets"></div>
</div>
<div id="precisionSummary"></div>`},
{
id:'presentlab',label:'Translator 06 · Presentation',phase:'Translator · Understand',html:`<div class="kicker">INTERPRETATION RECORD · 06</div>
<h2>Table, Rename & Presentation Lab · Incident Handoff Studio</h2>
<p class="lede">A manager is waiting for a usable incident handoff. Your challenge is not merely to recognize <code>table</code> and <code>rename</code> syntax—it is to turn a noisy Splunk result into a report another person can understand in seconds. Every decision you make changes the live handoff.</p>
<div class="handoff-pressure"><div><span>REQUEST STATUS</span><b>Waiting for analyst handoff</b></div><div><span>RAW RESULT</span><b>6 fields</b></div><div><span>TARGET</span><b>3 useful columns</b></div><div><span>QUALITY GOAL</span><b>Focused + readable + accurate</b></div></div>

<div class="instructionbox"><b>Manager request:</b> “Give me a clean report showing <b>Product, Client IP, and Status</b>. I do not need the host, timestamp, or URI path.” Your job is to turn the raw Splunk result into that presentation without confusing a search-time display change with a permanent data change.</div>

<div class="report-studio">
 <div class="studio-brief"><div><span>REQUEST</span><b>Web Failure Handoff</b></div><div><span>AUDIENCE</span><b>Service Operations</b></div><div><span>DELIVERABLE</span><b>3-column report</b></div></div>

 <section class="studio-stage" id="prs1">
  <div class="studio-stage-head"><span>01 · BUILD THE TABLE CANVAS</span><code>| table ...</code></div>
  <p><b>Click fields to add them to your report canvas.</b> As you work, the preview changes immediately. Then use the arrow controls to arrange the three requested columns in the manager's requested order.</p>
  <div class="raw-result"><div class="canvas-label">RAW SPLUNK RESULT</div>
   <table class="dataset"><tr><th>_time</th><th>host</th><th>product_name</th><th>clientip</th><th>status</th><th>uri_path</th></tr>
   <tr><td>09:42:18</td><td>web-02</td><td>Dream Crusher</td><td>74.64.12.9</td><td>500</td><td>/checkout</td></tr>
   <tr><td>09:43:02</td><td>web-01</td><td>Cloud Nine</td><td>10.4.2.8</td><td>503</td><td>/login</td></tr></table>
  </div>
  <div class="field-tray"><div class="canvas-label">AVAILABLE FIELDS · CLICK TO ADD / REMOVE</div><div id="prsFields" class="presentation-fields"></div></div>
  <div class="report-canvas"><div class="canvas-label">YOUR TABLE COMMAND</div><code id="tableCommandPreview">| table</code><div id="columnOrderControls" class="column-order-controls"></div><div id="liveTablePreview"></div></div>
  <button class="primary" onclick="checkPresentationFields()">Lock Table Design</button><div id="prs1fb"></div>
 </section>

 <section class="studio-stage locked-stage" id="prs2">
  <div class="studio-stage-head"><span>02 · RENAME THE HEADERS</span><code>| rename ...</code></div>
  <p><b>Make the technical field names readable for the audience.</b> Choose the display label for each field and watch the report header update before committing.</p>
  <div class="rename-builder">
   <label><code>product_name</code><select id="rn1" onchange="previewRename()"><option value="">Choose display name…</option><option>Status</option><option>Product Name</option><option>Client IP</option></select></label>
   <label><code>clientip</code><select id="rn2" onchange="previewRename()"><option value="">Choose display name…</option><option>Product Name</option><option>Client IP</option><option>Status</option></select></label>
   <label><code>status</code><select id="rn3" onchange="previewRename()"><option value="">Choose display name…</option><option>Client IP</option><option>Status</option><option>Product Name</option></select></label>
  </div>
  <div class="report-canvas"><div class="canvas-label">LIVE PRESENTATION PREVIEW</div><code id="renameCommandPreview">| rename ...</code><div id="renameLivePreview"></div></div>
  <button class="primary" onclick="checkPresentationRename()">Apply Header Rename</button><div id="prs2fb"></div>
 </section>

 <section class="studio-stage locked-stage" id="prs3">
  <div class="studio-stage-head"><span>03 · COMMAND EFFECT SORTING</span><code>TABLE vs RENAME vs NEITHER</code></div>
  <p>Now classify what each command actually did. Click a behavior card, then place it under <b>TABLE</b>, <b>RENAME</b>, or <b>NEITHER</b>. This separates presentation behavior from common misconceptions.</p>
  <div id="effectCards" class="effect-card-bank"></div>
  <div class="effect-zones">
   <div><b>TABLE</b><span>Controls fields shown</span><div id="zoneTable" class="effect-zone"></div></div>
   <div><b>RENAME</b><span>Controls field names</span><div id="zoneRename" class="effect-zone"></div></div>
   <div><b>NEITHER</b><span>Not caused by these commands</span><div id="zoneNeither" class="effect-zone"></div></div>
  </div>
  <div class="zone-actions"><button type="button" onclick="placeEffect('table')">Place in TABLE</button><button type="button" onclick="placeEffect('rename')">Place in RENAME</button><button type="button" onclick="placeEffect('neither')">Place in NEITHER</button></div>
  <button class="primary" onclick="checkPresentationEffects()">Audit Command Effects</button><div id="prs3fb"></div>
 </section>

 <section class="studio-stage locked-stage" id="prs4">
  <div class="studio-stage-head"><span>04 · RELEASE THE HANDOFF</span><code>QUALITY GATE</code></div>
  <p>You are the final analyst reviewer. Inspect the finished report and decide whether each quality requirement has been satisfied before releasing it to Service Operations.</p>
  <div class="release-preview"><div class="canvas-label">FINAL HANDOFF PREVIEW</div>
   <table class="dataset"><tr><th>Product Name</th><th>Client IP</th><th>Status</th></tr><tr><td>Dream Crusher</td><td>74.64.12.9</td><td>500</td></tr><tr><td>Cloud Nine</td><td>10.4.2.8</td><td>503</td></tr></table>
  </div>
  <div id="qualityGate" class="quality-gate">
   <button type="button" data-q="scope">□ Only requested fields are shown</button>
   <button type="button" data-q="labels">□ Technical names are audience-readable</button>
   <button type="button" data-q="meaning">□ Renamed headers preserve field meaning</button>
   <button type="button" data-q="source">□ Indexed source data remains unchanged</button>
  </div>
  <button class="primary" id="releaseHandoffBtn" disabled>Release Handoff</button><div id="prs4fb"></div>
 </section>
</div>
<div id="presentationSummary"></div>`},
{
id:'deduplab',label:'Translator 07 · dedup',phase:'Translator · Understand',html:`<div class="kicker">INTERPRETATION RECORD · 07</div>
<h2>dedup Behavior Lab · Duplicate Resolution Console</h2>
<p class="lede"><code>dedup</code> is not simply “remove duplicates.” Its behavior depends on the field list, the order of incoming events, and—when specified—how many duplicate results Splunk is told to keep. In this console, you will work directly with an event stream and watch those decisions change the result set.</p>

<div class="instructionbox"><b>Your assignment:</b> A web investigation contains repeated client IP activity. Work through three duplicate-resolution cases. First identify duplicate groups yourself, then predict which events survive, and finally interpret how field combinations and <code>dedup 2</code> change the behavior. The console will not reveal the expert explanation until you commit each decision.</div>

<div class="dedup-console">
 <section class="dedup-stage" id="dd1">
  <div class="dedup-head"><span>CASE 01 · FIND THE DUPLICATE GROUPS</span><code>| dedup clientip</code></div>
  <p>The historical results below are shown in the order Splunk encounters them: most recent first. Click every event that belongs to a <code>clientip</code> group appearing more than once.</p>
  <div id="dedupStream" class="event-stream"></div>
  <button class="primary" onclick="checkDedupGroups()">Validate Duplicate Groups</button><div id="dd1fb"></div>
 </section>

 <section class="dedup-stage locked-stage" id="dd2">
  <div class="dedup-head"><span>CASE 02 · PREDICT WHAT SURVIVES</span><code>| dedup clientip</code></div>
  <div class="handoff-receipt"><b>Rule in effect:</b> keep the first encountered event for each unique <code>clientip</code> value.</div>
  <p>Select the event IDs you expect to remain after <code>dedup clientip</code>.</p>
  <div id="dedupSurvivors" class="event-picks"></div>
  <button class="primary" onclick="checkDedupSurvivors()">Run dedup</button><div id="dd2fb"></div>
 </section>

 <section class="dedup-stage locked-stage" id="dd3">
  <div class="dedup-head"><span>CASE 03 · CHANGE THE KEY</span><code>| dedup clientip uri_path</code></div>
  <p>The duplicate key now contains <b>two fields</b>. Select the rows that should survive when two events count as duplicates only if their <code>clientip + uri_path</code> combination is identical.</p>
  <div id="dedupCombo" class="event-picks"></div>
  <button class="primary" onclick="checkDedupCombo()">Validate Combination Key</button><div id="dd3fb"></div>
 </section>

 <section class="dedup-stage locked-stage" id="dd4">
  <div class="dedup-head"><span>CASE 04 · KEEP MORE THAN ONE</span><code>| dedup 2 clientip</code></div>
  <p>Now Splunk may keep up to two events for each <code>clientip</code>. Predict the number of rows that will remain from the same five-event stream.</p>
  <div class="count-console"><button onclick="pickDedupCount(3,this)">3 rows</button><button onclick="pickDedupCount(4,this)">4 rows</button><button onclick="pickDedupCount(5,this)">5 rows</button><button onclick="pickDedupCount(2,this)">2 rows</button></div>
  <button id="dd4run" class="primary" disabled onclick="checkDedupCount()">Commit Count & Run</button><div id="dd4fb"></div>
 </section>
</div>
<div id="dedupSummary"></div>`},
{
id:'sortlab',label:'Translator 08 · sort',phase:'Translator · Understand',html:`<div class="kicker">INTERPRETATION RECORD · 08</div>
<h2>sort Behavior Lab · Result Ordering Simulator</h2>
<p class="lede"><code>sort</code> changes the order of search results—but field type, direction, multiple sort keys, and the optional result limit all affect what you actually see. In this simulator, you will manipulate a result set instead of simply identifying syntax.</p>

<div class="instructionbox"><b>Your assignment:</b> A SOC analyst needs a predictable incident handoff. Work directly with the five-result queue. You will build an expected order, run the SPL behavior, inspect where your reasoning differs, and then interpret several realistic sort statements. The expert review explains every decision after you commit.</div>

<div class="sort-simulator">
 <div class="sort-source">
  <div class="sort-source-head"><span>INCOMING RESULT SET</span><b>5 events · current pipeline order</b></div>
  <div id="sortSourceRows"></div>
 </div>

 <section class="sort-stage" id="st1">
  <div class="sort-head"><span>01 · DESCENDING NUMERIC ORDER</span><code>| sort - response_time</code></div>
  <p>Build the output order yourself. Click event cards in the order you believe Splunk will return them. Use <b>Undo</b> if you want to revise before running the command.</p>
  <div id="sortPool1" class="sort-pool"></div>
  <div class="sort-build"><span>YOUR PREDICTED OUTPUT</span><div id="sortOrder1" class="sort-order"></div></div>
  <button class="secondary" onclick="undoSort1()">Undo Last</button> <button class="primary" onclick="runSort1()">Run sort</button>
  <div id="st1fb"></div>
 </section>

 <section class="sort-stage locked-stage" id="st2">
  <div class="sort-head"><span>02 · MULTI-FIELD TIE BREAK</span><code>| sort + status, - response_time</code></div>
  <p>First order by <code>status</code> ascending. When two events share the same status, use <code>response_time</code> descending as the tie-breaker. Build the full event order.</p>
  <div id="sortPool2" class="sort-pool"></div>
  <div class="sort-build"><span>YOUR PREDICTED OUTPUT</span><div id="sortOrder2" class="sort-order"></div></div>
  <button class="secondary" onclick="undoSort2()">Undo Last</button> <button class="primary" onclick="runSort2()">Run multi-field sort</button>
  <div id="st2fb"></div>
 </section>

 <section class="sort-stage locked-stage" id="st3">
  <div class="sort-head"><span>03 · RESULT LIMIT CONTROL</span><code>| sort 3 - response_time</code></div>
  <p>The first argument now limits the sorted output. Select the <b>three event IDs</b> that will remain, then validate your result set.</p>
  <div id="sortLimitPicks" class="event-picks"></div>
  <button class="primary" onclick="checkSortLimit()">Validate Top 3</button><div id="st3fb"></div>
 </section>

 <section class="sort-stage locked-stage" id="st4">
  <div class="sort-head"><span>04 · SORT INTERPRETATION AUDIT</span><code>direction · type · limit · missing values</code></div>
  <p>For each analyst statement, choose the interpretation that best matches the lesson. The alternatives are intentionally plausible; read the exact behavior before committing.</p>
  <div id="sortAudit"></div><div id="st4fb"></div>

const vocab=[
['Field',`<div class="vocab-detail"><strong>Core meaning:</strong> A searchable name/value pairing in event data, such as <code>status=200</code> or <code>host=www2</code>.<br><strong>Why it matters:</strong> Fields let you search a specific attribute instead of scanning raw event text. That makes a search more precise and usually more efficient.<br><strong>Recognition clue:</strong> Think <em>label = value</em>. The field name tells Splunk what attribute you mean; the value tells Splunk what you want to match.</div>`],
['Indexed field',`<div class="vocab-detail"><strong>Core meaning:</strong> A field extracted at index time and stored with indexed data.<br><strong>Examples from the lesson:</strong> <code>host</code>, <code>source</code>, <code>sourcetype</code>, and <code>index</code> are important default fields created before search time.<br><strong>Distinction:</strong> Indexed fields already exist when the search begins; search-time fields can be added later while Splunk processes a search.</div>`],

['Internal field',`<div class="vocab-detail"><strong>Core meaning:</strong> Metadata/statistical information Splunk adds to help describe or track an event.<br><strong>Examples:</strong> The lessons discuss fields such as source, sourcetype, host, timestamp, <code>_raw</code>, and <code>_time</code> in their respective contexts.<br><strong>Command connection:</strong> <code>| fields - _*</code> can exclude internal underscore-prefixed fields from command output.</div>`],
['Fields Sidebar',`<div class="vocab-detail"><strong>Core meaning:</strong> The panel on the left side of the Search interface that exposes fields available in current results.<br><strong>What you can learn:</strong> Which fields are selected, which are interesting, their value type, unique-value count, and the complete All Fields list.<br><strong>Why it matters:</strong> It is a discovery tool: it helps you understand the structure of unfamiliar event data before writing a more precise search.</div>`],
['Selected Fields',`<div class="vocab-detail"><strong>Core meaning:</strong> Fields displayed with each event.<br><strong>Defaults:</strong> <code>host</code>, <code>source</code>, and <code>sourcetype</code>.<br><strong>Interaction:</strong> An Interesting Field can be moved into Selected Fields when you want it visible with events.</div>`],
['Interesting Fields',`<div class="vocab-detail"><strong>Core meaning:</strong> Fields that occur in at least 20% of the events returned by the search.<br><strong>Important distinction:</strong> “Interesting” is based on frequency in the current results; it does not mean the field is more important to the analyst.<br><strong>Recognition clue:</strong> 20% is the threshold to remember.</div>`],
['Field Window',`<div class="vocab-detail"><strong>Core meaning:</strong> The detail window opened by selecting a field in the Fields Sidebar.<br><strong>What it supports:</strong> Inspect values, add the field to a search, click a value to add a field-value pair, and create reports.<br><strong>Important detail:</strong> Numeric and alphanumeric fields can expose different report options; report actions can add transforming commands automatically.</div>`],
['Fast Mode',`<div class="vocab-detail"><strong>Core meaning:</strong> Prioritizes speed over completeness and disables general field discovery.<br><strong>What remains:</strong> Default/indexed fields and fields explicitly referenced in the basic search can still be returned.<br><strong>Transforming search behavior:</strong> Results are presented through Statistics or Visualizations rather than a full event list.</div>`],
['Smart Mode',`<div class="vocab-detail"><strong>Core meaning:</strong> Splunk's default search mode, balancing speed and completeness.<br><strong>Behavior:</strong> It behaves more like Fast Mode for transforming searches and more like Verbose Mode for non-transforming searches.<br><strong>Memory cue:</strong> Smart adapts to the kind of search you run.</div>`],
['Verbose Mode',`<div class="vocab-detail"><strong>Core meaning:</strong> Prioritizes completeness over speed.<br><strong>What it returns:</strong> All extracted fields plus the full event list and timeline.<br><strong>Tradeoff:</strong> It is the slowest mode because more search information must be returned.</div>`],
['Wildcard (*)',`<div class="vocab-detail"><strong>Core meaning:</strong> Matches an unlimited number of characters in a string.<br><strong>Example:</strong> <code>status="fail*"</code> can match values beginning with <code>fail</code>.<br><strong>Efficiency guidance:</strong> A specific term is better when possible; when a wildcard is needed, the lesson prefers it at the end. Avoid prefix wildcards and using wildcards to guess punctuation.</div>`],

['fields',`<div class="vocab-detail"><strong>Core meaning:</strong> Includes or excludes fields from search results.<br><strong>Include:</strong> <code>| fields + clientip status</code>; omitting the sign defaults to inclusion.<br><strong>Exclude:</strong> <code>| fields - categoryId</code>. Multiple fields use spaces. <code>_raw</code> and <code>_time</code> are included by default; <code>| fields - _*</code> excludes underscore-prefixed internal fields.<br><strong>Performance:</strong> Inclusion early can reduce unnecessary field extraction.</div>`],
['dedup',`<div class="vocab-detail"><strong>Core meaning:</strong> Removes events with identical combinations of specified field values.<br><strong>Retention:</strong> Which event survives depends on search order. Historical searches normally encounter recent events first; real-time searches use arrival order.<br><strong>Options:</strong> A number can keep multiple duplicates, and <code>sortby</code> can influence retention.<br><strong>Caution:</strong> Avoid deduplicating <code>_raw</code> over large datasets because of memory impact.</div>`],
['sort',`<div class="vocab-detail"><strong>Core meaning:</strong> Orders results by specified fields.<br><strong>Direction:</strong> <code>-</code> descending, <code>+</code> ascending. Multiple sort fields use commas.<br><strong>Limit:</strong> Without a numeric first argument, the lesson gives a default maximum of 10,000 results; <code>sort 0</code> returns all.<br><strong>Type behavior:</strong> Numbers sort numerically; strings sort lexicographically.</div>`],
['eval',`<div class="vocab-detail"><strong>Core meaning:</strong> Calculates an expression and writes the result into a search-results field.<br><strong>Create vs overwrite:</strong> It can create a new field or overwrite a field's values for the current search, but it does not change the index.<br><strong>Capabilities:</strong> Arithmetic, string, and Boolean expressions; chained expressions run left-to-right.<br><strong>Functions demonstrated:</strong> <code>pow()</code>, <code>tostring()</code>, <code>strftime()</code>, <code>if()</code>, <code>case()</code>, <code>lower()</code>, and <code>cidermatch()</code>.</div>`],
['table',`<div class="vocab-detail"><strong>Core meaning:</strong> Displays chosen fields in a tabular result.<br><strong>Purpose:</strong> Makes multi-field results easier to read and present.<br><strong>Pipeline connection:</strong> It is a command stage, so it receives the current results through a pipe and reshapes their presentation.</div>`],
['rename',`<div class="vocab-detail"><strong>Core meaning:</strong> Assigns a more meaningful field name for the lifetime of the search.<br><strong>Important:</strong> It does not permanently change indexed data.<br><strong>Syntax:</strong> Use double straight quotes when the new field name contains spaces or special characters.<br><strong>Afterward:</strong> Later commands in that same search must use the new field name.</div>`]

const rationales={"notq": ["Incorrect. This reverses the two behaviors. The != expression excludes events where src_ip is missing; NOT keeps those missing-field events.", "Incorrect. The two searches are not equivalent because they handle events with no src_ip differently.", "Correct. != requires src_ip to exist and differ, while NOT excludes only the specified match and therefore keeps events where src_ip is absent."], "fd1": ["Incorrect. Search-time fields can be extracted after indexing, so not every field is permanently stored during index time.", "Correct. Default/indexed fields exist before the search, while additional fields can be extracted or created at search time.", "Incorrect. Sourcetype is one of the mechanisms Splunk can use to interpret raw data and create search-time fields."], "fd2": ["Correct. The lesson defines Interesting Fields as fields present in at least 20% of returned events.", "Incorrect. Numeric versus alphanumeric is a field type distinction, not the Interesting Fields threshold.", "Incorrect. Manually choosing a field can make it Selected, but that does not define it as Interesting."], "fd3": ["Incorrect. These symbols do not identify index-time versus search-time extraction.", "Correct. α means alphanumeric, # means numeric, and the number on the right is the unique-value count.", "Incorrect. The sidebar symbols do not indicate search mode or speed."], "fd4": ["Correct. Numeric and alphanumeric fields can expose different report choices.", "Incorrect. Report creation is not restricted to indexed fields.", "Incorrect. Field Window reporting is not a Fast-mode-only feature."], "fl1": ["Correct. Quotes require the exact adjacent phrase in that order and also help with special characters.", "Incorrect. Quotes do not change whether the field name itself is case sensitive.", "Incorrect. Quotation marks define an exact phrase; the asterisk is the wildcard."], "fl2": ["Incorrect. A prefix wildcard forces broader matching and can create performance problems.", "Incorrect. A wildcard in the middle can be unreliable around punctuation and is not the recommended placement.", "Correct. The lesson identifies a trailing wildcard such as fail* as the preferred placement when a wildcard is necessary."], "fl3": ["Correct. Boolean operators are uppercase and AND is implied unless another operator changes the relationship.", "Incorrect. The lesson explicitly requires uppercase Boolean operators.", "Incorrect. OR broadens the match to at least one condition; NOT is the exclusion operator."], "fl4": ["Correct. The lesson explicitly describes NOT and != exclusion as less efficient and says inclusion is better when possible.", "Incorrect. NOT filters search results; it does not delete indexed events.", "Incorrect. != is a valid comparison expression; the concern here is exclusion behavior and efficiency."], "pr1": ["Incorrect. Once rename executes, later stages must refer to the renamed field, not the original name.", "Correct. The new field name is the name available to later commands in that search.", "Incorrect. The lesson states that the new name must be used after rename."], "pr2": ["Incorrect. rename does not alter the indexed field name permanently.", "Correct. rename affects the search result for the lifetime of that search only.", "Incorrect. Search commands do not rename the original source file."], "fc1": ["Incorrect. Exclusion requires a minus sign.", "Correct. With no + or - sign, fields defaults to inclusion.", "Incorrect. fields controls which fields are included or excluded; sort controls ordering."], "fc2": ["Correct. Restricting needed fields early can reduce resource-intensive field extraction.", "Incorrect. fields has no effect on whether rename is permanent.", "Incorrect. fields changes result fields; it does not disable an index."], "fc3": ["Correct. The underscore wildcard targets internal underscore-prefixed fields in this lesson.", "Incorrect. The plus sign would include matching fields rather than exclude them.", "Incorrect. With no minus sign, this syntax defaults to inclusion rather than removal."], "fc4": ["Incorrect. Commas are used for multiple fields in the sort syntax taught later, not for a fields field-list.", "Correct. Multiple fields in a fields field-list are separated by spaces.", "Incorrect. A pipe starts the next pipeline command; it does not separate names inside the field list."], "dd1": ["Correct. Historical and real-time searches establish order differently, and dedup retention depends on that order.", "Incorrect. Real-time searches can still use clientip; the difference is event arrival/search order.", "Incorrect. Historical dedup does remove duplicate combinations; it does not automatically keep all duplicates."], "dd2": ["Correct. sortby requires collecting the result set before sorting, so the command behaves as dataset processing.", "Incorrect. sortby changes retention order; it does not turn dedup into field extraction.", "Incorrect. Sorting in a search does not permanently reorder indexed data."], "dd3": ["Correct. The numeric argument tells dedup to retain the first three duplicate results for the specified field criteria.", "Incorrect. The number is not a count of fields to remove.", "Incorrect. dedup 3 does not create three groups; it controls how many duplicates are retained."], "dd4": ["Correct. Keeping every raw event text in memory across a large result set can hurt search performance.", "Incorrect. _raw is event text, not a numeric field.", "Incorrect. The warning concerns memory/performance, not disabling an interface tab."], "so1": ["Incorrect. The lesson does not give 100 as the default sort limit.", "Incorrect. The lesson does not give 1,000 as the default sort limit.", "Correct. Without a numeric first argument, the lesson states a default limit of 10,000 results."], "so2": ["Incorrect. Spaces separate field names in the fields command, but the lesson specifies commas for multiple sort fields.", "Correct. Multiple sort field names are separated with commas.", "Incorrect. Semicolons are not the delimiter taught for this sort syntax."], "so3": ["Incorrect. Splunk does not convert all sort values to numbers.", "Correct. Numeric values sort numerically, while strings sort lexicographically; the lesson notes uppercase before lowercase.", "Incorrect. String sorting follows lexicographic rules rather than random order."], "so4": ["Incorrect. In this syntax, zero does not mean zero returned events.", "Correct. sort 0 removes the normal result-count cap and returns all sorted results.", "Incorrect. Descending direction is indicated with a minus sign, not the numeric zero."], "ed1": ["Correct. Chained eval expressions are processed left-to-right, allowing later expressions to use earlier results.", "Incorrect. The lesson gives a defined left-to-right evaluation order.", "Incorrect. eval-created fields exist in search results; they are not written to the index first."], "ed2": ["Correct. These are the three tostring formatting behaviors demonstrated in the lesson.", "Incorrect. CIDR testing belongs to cidermatch, lowercase conversion belongs to lower, and UNIX time formatting belongs to strftime.", "Incorrect. tostring formatting has nothing to do with duplicate removal."], "ed3": ["Correct. The lesson specifies UNIX time in seconds for strftime.", "Incorrect. CIDR blocks are inputs to cidermatch, not strftime.", "Incorrect. strftime is specifically about time values, not only alphanumeric fields."], "ed4": ["Correct. cidermatch tests IP membership in a CIDR range, and its Boolean result can be used by if().", "Incorrect. cidermatch evaluates membership; it does not rewrite the IP address.", "Incorrect. cidermatch is not a sorting command."], "ed5": ["Correct. In eval, string literals use double quotes; field names are normally unquoted or single-quoted when special characters such as spaces require it.", "Incorrect. Double quotes are for string values in this eval guidance, not a requirement for every field name.", "Incorrect. String literals must be quoted in the eval syntax described by the lesson."]};
function qBlock(id,q,opts,ans,exp){return `<div class="activity"><div class="instructionbox"><b>Instructions:</b> Read the entire question and all choices before selecting. Choose the option that best matches the lesson's exact behavior. After you answer, review why every option is correct or incorrect.</div><h3>${q}</h3><div class="choices">${opts.map((o,i)=>`<button class="choice" onclick="answer('${id}',${i},${ans},this)">${o}</button>`).join('')}</div><div id="${id}" class="feedback" data-exp="${encodeURIComponent(exp)}"></div></div>`}
function answer(id,i,a,b){
 let box=document.getElementById(id),buttons=[...b.parentElement.querySelectorAll('.choice')];
 buttons.forEach(x=>x.classList.remove('selected'));b.classList.add('selected');
 box.className='feedback show '+(i===a?'':'bad');
 let rs=rationales[id]||[];
 let review=buttons.map((btn,n)=>{
   let why=rs[n]||(n===a?'This is the answer supported by the lesson.':'This option does not match the lesson behavior.');
   return `<div class="option-review ${n===a?'correct-review':'wrong-review'}"><b>Choice ${String.fromCharCode(65+n)} — ${n===a?'Correct answer':'Not the best answer'}:</b> ${why}</div>`;
 }).join('');
 box.innerHTML=`<b>${i===a?'Correct selection.':'Not quite.'}</b> ${rs[i]||decodeURIComponent(box.dataset.exp)}<div class="why"><b>Review every choice</b>${review}<div class="good"><b>Concept takeaway:</b> ${decodeURIComponent(box.dataset.exp)}</div></div>`;
}

function validateSyntax(){let picked=[...document.querySelectorAll('#syntax .toggle')].map(x=>x.classList.contains('on')?1:0),ok=picked.every((v,i)=>v===syntaxItems[i][1]);let b=document.getElementById('synfb');b.className='feedback show '+(ok?'':'bad');b.innerHTML=`<b>${ok?'Proof sheet accepted.':'Some marks need revision.'}</b> Field names are case sensitive while basic-search field values are not; Boolean operators are uppercase; AND is implied; quoted values preserve exact phrases/special characters; trailing wildcards are preferred; rename is temporary; and specifying an index is a best practice.`}
function drawOrder(){document.getElementById('sortlist').innerHTML=order.map((x,i)=>`<div class="sortitem"><span>${i+1}. ${x}</span><span><button onclick="move(${i},-1)">↑</button> <button onclick="move(${i},1)">↓</button></span></div>`).join('')}function move(i,d){let j=i+d;if(j<0||j>=order.length)return;[order[i],order[j]]=[order[j],order[i]];drawOrder()}function validateOrder(){let ok=order.every((x,i)=>x===correctOrder[i]),b=document.getElementById('orderfb');b.className='feedback show '+(ok?'':'bad');b.innerHTML=`<b>${ok?'Sequence verified.':'Sequence not yet correct.'}</b> A Splunk pipeline begins with search terms that retrieve events. A pipe hands the current result set to a command; the next command receives that output and transforms it again.`}
