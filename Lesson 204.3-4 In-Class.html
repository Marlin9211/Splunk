<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Quay | Defense Analyst Simulation</title><style>:root{font-family:Inter,system-ui,Arial;background:#eef3f7;color:#172a3b}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:#126d79;color:white;font-weight:650}button:disabled{opacity:.45;cursor:not-allowed}.shell{display:flex;min-height:100vh}aside{width:270px;flex-shrink:0;background:#112d3c;color:#e7f5f6;padding:22px 15px;transition:width .2s;overflow:hidden}aside.closed{width:64px}aside.closed .navtext,aside.closed .brandtext,aside.closed .asidefoot{display:none}aside button{background:transparent;color:inherit;text-align:left;width:100%;padding:12px;margin:3px 0}aside button.active{background:#226078}aside button:hover{background:#244b5c}.brand{display:flex;align-items:center;gap:10px;padding:12px 8px 26px}.mark{background:#2b9ca5;padding:9px;border-radius:12px}.asidefoot{font-size:12px;color:#acc5cf;padding:20px 12px}main{flex:1;min-width:0}.top{background:white;padding:17px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dbe4ea}.content{max-width:1040px;margin:32px auto;padding:0 24px 60px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:#117a83;text-transform:uppercase}.hero{background:linear-gradient(120deg,#123d52,#126c78);color:white;border-radius:20px;padding:34px;margin-bottom:22px}.hero h1{font-size:clamp(26px,4vw,42px);margin:9px 0}.hero p{color:#d5ebed;max-width:730px;line-height:1.6}.card{background:white;border:1px solid #dce6eb;border-radius:17px;padding:25px;margin:16px 0;box-shadow:0 5px 18px #193a4b0a}.card h2{margin-top:0}.muted{color:#597181;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.mini{background:#f1f7f8;border:1px solid #d8e9ea;border-radius:12px;padding:16px}.mini strong{display:block;margin-bottom:7px}.chip{display:inline-block;padding:5px 10px;background:#d8eff0;color:#075b67;border-radius:50px;font-size:12px;font-weight:800;margin:3px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.choice{width:100%;text-align:left;background:#f3f7f9;color:#173b4a;border:1px solid #cadce3;margin:7px 0;padding:14px}.choice.selected{background:#d5eff0;border:2px solid #167e87}.choice.wrong{border-color:#c35d48;background:#fff0ec}.choice.correct{border-color:#26856c;background:#e7f8f0}.feedback{padding:15px;border-radius:11px;margin:15px 0;background:#eaf3f8;border-left:4px solid #2b7b99;line-height:1.65}.warning{background:#fff4e8;border-color:#ce8a31}.success{background:#e7f7ef;border-color:#28875c}.footer{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.secondary{background:#dbe8ed;color:#174052}.progress{height:8px;background:#dce7eb;border-radius:20px;overflow:hidden}.progress span{display:block;background:#2f9b91;height:100%;transition:width .2s}input,textarea,select{width:100%;border:1px solid #b9d0d9;padding:12px;border-radius:9px;background:white;color:#163645}textarea{min-height:100px}label{display:block;font-weight:700;margin:12px 0 6px}.item{border:1px solid #d5e2e7;background:#f9fcfd;padding:13px;border-radius:10px;margin:8px 0}.small{font-size:13px}.step{display:inline-block;background:#e5f3f2;border-radius:50%;padding:7px 12px;margin-right:8px}.hidden{display:none}details{margin:12px 0;background:#f3f7f8;border-radius:10px;padding:12px}summary{cursor:pointer;font-weight:700}@media(max-width:700px){aside{width:64px}aside .navtext,aside .brandtext,aside .asidefoot{display:none}aside.open{width:230px;position:fixed;z-index:3;height:100vh}aside.open .navtext,aside.open .brandtext,aside.open .asidefoot{display:inline}.content{padding:0 14px;margin:18px auto}.top{padding:13px}.hero{padding:24px}.card{padding:18px}}/* Scrollable application workspace and navigation rview{grid-template-columns:1fr}.op-options{grid-template-columns:1fr}}

const stages=['Welcome','Prework Transition','Learning Objectives','Mission Briefing','Operator Briefing','Operator Work','Detective Briefing','Detective Work','Judge Briefing','Judge Work','Final Debrief','Participation Summary'];let stage=0,name='',answers={},complete={},notes={},attempts={};const $=id=>document.getElementById(id);const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toggleSide(){$('side').classList.toggle(innerWidth<700?'open':'closed')}function jump(i){stage=i;render();document.querySelector("main").scrollTop=0;document.querySelector("main").scrollTop=0;if(innerWidth<700)$('side').classList.remove('open')}function done(i){complete[i]=true;render()}function next(){stage=Math.min(stage+1,11);render();document.querySelector("main").scrollTop=0}function prev(){stage=Math.max(stage-1,0);render();document.querySelector("main").scrollTop=0}function saveNote(id){notes[id]=$(id).value}function section(title,sub,body){return `<div class="hero"><div class="eyebrow" style="color:#9bdfd9">${safe(stages[stage])} • SIGNAL QUAY</div><h1>${title}</h1><p>${sub}</p></div>${body}`};function card(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}function foot(){return `<div class="footer"><button class="secondary" onclick="prev()" ${stage===0?'disabled':''}>← Previous</button><button onclick="next()" ${stage===11?'disabled':''}>${stage===10?'Participation summary →':'Continue →'}</button></div>`}
const cases=[{id:'routing',title:'Detection readiness desk',type:'match',intro:'Three detection proposals are on the queue. Assign the correct readiness status to each based on what is known. Review the evidence before making a deployment decision.',rows:[['Local admin account creation','Windows Security logs are present and mapped; detection search has been tested against sample events.','Ready for deployment'],['Unusual cloud authentication','Cloud authentication logs have not yet been onboarded.','Waiting for data'],['Repeated network scan','The search runs, but the scheduled alert generates excessive noise during approved scanning.','Deployment issues']],opts:['Deployment issues','Ready for deployment','Waiting for data'],explain:'SSE bookmark statuses distinguish content that can be deployed, content blocked by missing data, and content with implementation problems. Available logs alone do not prove a detection is ready: validate search behavior and operational impact.'},{id:'triage',title:'SOC intake routing',type:'match',intro:'The security manager needs the right specialist for each work item. Route the work without giving analysts responsibilities reserved for other roles.',rows:[['Review notable authentication events and determine disposition','Defense analyst'],['Create and test a detection for local administrator creation','Detection engineer'],['Choose and integrate monitoring technologies','Security architect'],['Coordinate team priorities and remove operational blockers','SOC manager']],opts:['Security architect','Defense analyst','SOC manager','Detection engineer'],explain:'Analysts investigate notable events and follow runbooks; engineers develop detections; architects select and integrate technologies; managers coordinate operations. These roles collaborate but are not interchangeable.'},{id:'timeline',title:'Alert reconstruction',type:'order',intro:'Place the investigative steps in a defensible sequence. The objective is to avoid assuming that the initial alert proves compromise.',items:['Determine whether the alert reflects a real incident','Establish whether the attempted activity succeeded','Reconstruct what happened from available evidence','Check whether other assets were affected','Select a proportionate response'],explain:'The source triage workflow asks whether an incident occurred, whether it succeeded, what happened, whether other assets were affected, and how security operations should respond. Conclusions should follow evidence, not precede it.'},{id:'signal',title:'Evidence interpretation board',type:'match',intro:'The investigation has produced additional records. Classify what each record supports, without converting uncertainty into certainty.',rows:[['Three failed sign-ins followed by one successful sign-in from a familiar office IP','Suspicious but not conclusive'],['Approved scanner schedule matches IDS port-scan timestamps','Likely benign explanation'],['Windows Security records show unauthorized admin group membership change, confirmed by owner','Confirmed security incident'],['Endpoint telemetry unavailable for the affected workstation','Evidence gap']],opts:['Confirmed security incident','Evidence gap','Likely benign explanation','Suspicious but not conclusive'],explain:'A true-positive disposition requires sufficient evidence of an incident. A matching authorized change or scan can explain an alert, while missing telemetry is an investigative limitation rather than proof of safety or compromise.'},{id:'criteria',title:'Detection selection review',type:'match',intro:'Evaluate SSE use-case attributes. Identify the purpose of each attribute before recommending a detection.',rows:[['Required Windows Security logs and event coverage','Data source prerequisite'],['Expected frequency of alerts','Alert volume'],['Complexity of the detection search','SPL difficulty'],['Mapped ATT&CK techniques and tactics','Framework mapping'],['Position along the maturity roadmap','Security Data Journey']],opts:['SPL difficulty','Framework mapping','Security Data Journey','Alert volume','Data source prerequisite'],explain:'Use-case details include source prerequisites, security impact, alert volume, SPL difficulty, framework mappings, and journey stage. Together they help analysts determine relevance and feasibility rather than selecting a detection by title alone.'}];
function quiz(c){let a=answers[c.id]||{},locked=!!complete[c.id];let html=`<p class="muted">${c.intro}</p><div class="row"><span class="chip">${c.type==='order'?'Sequencing':'Evidence matching'}</span><span class="chip">${Object.keys(a).length}/${c.type==='order'?c.items.length:c.rows.length} assigned</span></div>`;if(c.type==='match'){c.rows.forEach((r,i)=>{html+=`<div class="item"><strong>${i+1}. ${r[0]}</strong>${r[1]&&r.length>2?`<p class="muted small">${r[1]}</p>`:''}<select aria-label="Classification ${i+1}" onchange="setAnswer('${c.id}',${i},this.value)" ${locked?'disabled':''}><option value="">Select an assignment</option>${c.opts.map(o=>`<option ${a[i]===o?'selected':''}>${o}</option>`).join('')}</select></div>`})}else{html+=`<p class="small muted">Assign a position from 1 to 5 to every step. Each position must be used once.</p>`;c.items.slice().reverse().forEach(item=>{let i=c.items.indexOf(item);html+=`<div class="item"><strong>${item}</strong><select aria-label="Sequence position" onchange="setAnswer('${c.id}',${i},this.value)" ${locked?'disabled':''}><option value="">Position</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${a[i]==n?'selected':''}>${n}</option>`).join('')}</select></div>`})}html+=`<button ${locked?'disabled':''} onclick="check('${c.id}')">Validate work product</button><div id="result-${c.id}">${locked?`<div class="feedback success"><strong>Work product validated.</strong><p>${c.explain}</p><details><summary>Review the completed rationale</summary>${(c.rows||c.items.map((x,i)=>[x,String(i+1)])).map(r=>`<p><b>${r[0]}</b> → ${r[r.length-1]}</p>`).join('')}</details></div>`:''}</div>`;return html}
function setAnswer(id,i,v){answers[id]??={};answers[id][i]=v}function check(id){let c=cases.find(x=>x.id===id),a=answers[id]||{},correct=c.type==='match'?c.rows.every((r,i)=>a[i]===r[r.length-1]):c.items.every((_,i)=>Number(a[i])===i+1);attempts[id]=(attempts[id]||0)+1;if(correct){complete[id]=true;render()}else{$('result-'+id).innerHTML=`<div class="feedback warning"><strong>Revision required.</strong> ${c.type==='order'?'Check for repeated positions and compare the sequence against the five investigation questions.':'At least one assignment conflicts with the available evidence or role. Re-examine the wording and revise the assignments.'} The correct assignments are not displayed until validation succeeds.</div>`}}

const operatorTasks=[
{id:'role',title:'01 / Dispatch the SOC work queue',intro:'The manager has received four work orders. Assign the accountable role for each. Select based on the actual deliverable, not job title alone.',rows:[
['Review SQ-WIN-17 authentication records and document whether the alert merits escalation.','Defense analyst','The analyst performs event triage and documents the evidence-based disposition.','A detection engineer writes detection logic rather than owning initial incident disposition; an architect integrates security systems; the manager coordinates resources.'],
['Develop and test a search for newly added local administrators.','Detection engineer','The detection engineer creates and tests the detection logic before release.','The analyst may identify the need, but developing a reliable search is engineering work; architecture and management have different responsibilities.'],
['Determine how to connect the new cloud log source to the monitoring platform.','Security architect','The architect plans how the source integrates with the monitoring environment.','An engineer may implement part of the integration, but the architecture decision is about the overall technology design.'],
['Resolve competing priorities between the alert investigation and a scheduled rollout.','SOC manager','The manager coordinates priorities, staffing and operational tradeoffs.','Analysts and engineers provide technical evidence, but do not independently decide the team-wide priority.']]},
{id:'readiness',title:'02 / Review detection release tickets',intro:'The SSE-style catalog lists three proposed detections. Inspect their operational evidence and assign the correct release disposition.',rows:[
['Local administrator creation: Windows events are mapped; sample tests passed; alert ownership is assigned.','Ready for deployment','The required data, validation and operational ownership are documented.','Waiting for data ignores the available Windows events; deployment issues would require a known unresolved operational problem.'],
['Cloud sign-in anomaly: the query is documented, but cloud authentication events are not onboarded.','Waiting for data','Without the required cloud events, the detection cannot evaluate real activity.','A documented search does not make a detection deployable; this is a missing prerequisite rather than a noisy alert.'],
['Network scan: events arrive and the search runs, but approved scans repeatedly trigger the alert.','Deployment issues','The detection runs but has an unresolved false-positive/noise problem.','It is not waiting for data because events are present, and it is not ready until its operational behavior is addressed.']]},
{id:'handoff',title:'03 / Build the operational handoff',intro:'A manager needs a concise handoff before the Detective starts. Choose the action supported by each constraint.',rows:[
['The local-admin detection passed testing, but no investigator is assigned to review its alerts.','Assign an alert owner','Assigning an accountable responder closes the operational ownership gap.','Rewriting a validated search does not establish ownership; importing more unrelated logs does not solve the handoff gap.'],
['Cloud authentication events are missing from the SIEM.','Request source onboarding','The data source must be connected and checked before the search can be validated.','Tuning thresholds cannot replace absent events; escalating a confirmed compromise is unsupported by this fact.'],
['An authorized scanner is creating repeated IDS notables.','Tune with scan context','Use the approved scanning context to reduce noise while retaining visibility.','Disabling all IDS alerts loses coverage; treating every matching scan as an incident ignores authorization evidence.']]}
];
const operatorOptions={role:['SOC manager','Detection engineer','Defense analyst','Security architect'],readiness:['Deployment issues','Ready for deployment','Waiting for data'],handoff:['Tune with scan context','Request source onboarding','Assign an alert owner']};
const opState={};
function opGet(id){return opState[id]??={active:0,revealed:{},selected:{},errors:{},validated:{}}}
// Each ticket has distinct, scenario-specific language. Keys remain stable for validation.
const operatorDecisionLabels={
 role:[
 {'SOC manager':'Coordinate the investigation priority and allocate staff across the active SOC queues.','Detection engineer':'Review the alert conditions and refine the authentication analytic if testing reveals a defect.','Defense analyst':'Correlate the sign-in evidence, document uncertainty, and recommend escalation based on findings.','Security architect':'Assess whether the identity telemetry and monitoring integrations provide adequate visibility.'},
 {'SOC manager':'Schedule the detection rollout and resolve any staffing conflicts with current investigations.','Detection engineer':'Build and test a search for local administrator additions using representative Windows events.','Defense analyst':'Review recent privileged-account changes and assess whether any warrant incident handling.','Security architect':'Evaluate which endpoint and identity integrations will sustain privileged-change monitoring.'},
 {'SOC manager':'Prioritize cloud monitoring against existing response commitments and assign a delivery owner.','Detection engineer':'Prototype cloud sign-in anomaly logic using available sample authentication events.','Defense analyst':'Investigate reported cloud account anomalies and identify evidence still needed for attribution.','Security architect':'Design the cloud-event collection path and verify its fit with the monitoring environment.'},
 {'SOC manager':'Balance investigation coverage against the planned release and assign accountable resources.','Detection engineer':'Compare the release search with test results and recommend whether technical changes are needed.','Defense analyst':'Assess the outstanding alert evidence and recommend which findings need urgent follow-up.','Security architect':'Review the platform dependencies and identify deployment risks for the scheduled rollout.'}
 ],
 readiness:[
 {'Deployment issues':'Keep the analytic in a supervised pilot while reviewing potential noise and rollout constraints.','Ready for deployment':'Proceed to controlled release using the tested Windows events and assigned response ownership.','Waiting for data':'Postpone activation until additional privileged-account sources are connected and verified.'},
 {'Deployment issues':'Run a limited pilot to evaluate how often the cloud sign-in search would alert.','Ready for deployment':'Approve the documented query for production with monitoring of early alert quality.','Waiting for data':'Hold production release until live cloud authentication events reach the SIEM and pass verification.'},
 {'Deployment issues':'Retain the detection in tuning while accounting for approved scanner activity without hiding other scans.','Ready for deployment':'Accept the running scan analytic and rely on routine analyst review to distinguish scheduled tests.','Waiting for data':'Defer the detection until additional network telemetry is collected to improve scan attribution.'}
 ],
 handoff:[
 {'Tune with scan context':'Adjust alert context so approved security testing is identified before dispatch.','Request source onboarding':'Expand the Windows event feed to include additional administrator-change fields.','Assign an alert owner':'Route the validated local-admin alerts to a named investigator and confirm acknowledgment responsibility.'},
 {'Tune with scan context':'Adjust the cloud anomaly threshold to reduce uncertainty during initial monitoring.','Request source onboarding':'Repair the cloud-to-SIEM event path and confirm that fresh authentication records arrive.','Assign an alert owner':'Designate a cloud-alert reviewer while the collection issue remains unresolved.'},
 {'Tune with scan context':'Scope scan-alert handling to the authorized scanner and maintenance window, retaining out-of-window review.','Request source onboarding':'Collect additional IDS metadata to establish a broader scan baseline before changing the alert.','Assign an alert owner':'Send recurring scanner alerts to a dedicated queue for manual operational review.'}
 ]
};
function opChoices(id,i){
 let opts=operatorOptions[id].map((value,j)=>({value,label:operatorDecisionLabels[id][i][value]}));
 // Deliberately vary the correct answer's displayed position by ticket.
 // Keep the underlying values and validation keys unchanged.
 const targetPositions={role:[0,2,3,1],readiness:[2,0,1],handoff:[1,2,0]};
 const task=operatorTasks.find(t=>t.id===id);
 const correct=task.rows[i][1];
 const correctIndex=opts.findIndex(o=>o.value===correct);
 const desired=targetPositions[id][i];
 const shift=(correctIndex-desired+opts.length)%opts.length;
 return opts.slice(shift).concat(opts.slice(0,shift));
}
function opSelect(id,i,v){let st=opGet(id);st.selected[i]=v;delete st.errors[i];operatorRefresh()}
function opReveal(id,i){opGet(id).revealed[i]=true;operatorRefresh()}
function opVerify(id,i){let st=opGet(id);attempts['operator-'+id]=(attempts['operator-'+id]||0)+1;if(!st.selected[i]){st.errors[i]='Select a disposition before recording this ticket.'}else{st.validated[i]=true;delete st.errors[i];st.active=i<operatorTasks.find(t=>t.id===id).rows.length-1?i+1:i;}operatorRefresh()}

ach exactly two primary evidence records</label><div class="row">${detRecords.map(r=>`<button class="${(s.proof[q.id]||[]).includes(r.id)?'':'secondary'}" ${s.solved?'disabled':''} onclick="detSealEvidence('${q.id}','${r.id}')">${(s.proof[q.id]||[]).includes(r.id)?'✓ ':''}${safe(r.label)}</button>`).join('')}</div>`:`<p class="feedback">Inspect four evidence records to unlock hypothesis testing and case assembly.</p>`}${s.solved?`<div class="feedback success"><b>Expert rationale:</b> ${safe(q.why)}<p><b>Why alternatives fail:</b> ${safe(q.wrong)}</p></div>`:''}</div>`).join('')}<button onclick="detSealCheck()" ${s.solved?'disabled':''}>Submit all three reconstructed casefiles →</button>${s.feedback?`<div class="feedback ${s.solved?'success':'warning'}" role="status">${safe(s.feedback)}</div>`:''}<p class="small muted">The application automatically checks structured decisions and evidence references. An instructor should review the evidence selections and investigative decisions before assessing mastery.</p>`)}
function detCheck(){
 if(!detSealState.submitted){detMessage='Record the Three Sealed Casefiles before submitting the complete investigation.';detRefresh();return}
 let missing=detModules.some(m=>m.rows.some((r,i)=>!detState[m.id][i]));
 if(missing){detMessage='Complete every timeline, evidence, and detection assignment before final evaluation. No correctness has been disclosed.';detRefresh();return}
 detTries++;
 let moduleOK=detModules.every(m=>m.rows.every((r,i)=>detState[m.id][i]===r[1]));
 let sealsOK=detSeals.every(q=>detSealState.answers[q.id]===q.correct && (detSealState.proof[q.id]||[]).length===2 && q.proof.every(x=>detSealState.proof[q.id].includes(x)) && detSealState.hypotheses[q.id]===q.id);
 if(moduleOK&&sealsOK){detValidated=true;detSealState.solved=true;complete.detective=true;detMessage='Complete investigation validated. Expert explanations are now available for review.'}
 else{detMessage='The full case package requires revision. No individual decision, seal, or evidence choice is identified as correct or incorrect. Review and resubmit the entire investigation.'}
 detRefresh();
}

?'Position '+r[1]:r[1])}:</b> ${safe(r[2])}</p>`).join('')}<p><b>Why other assignments fail:</b> ${m.kind==='sequence'?'A different order would risk deciding scope or response before establishing the incident and reconstructing its evidence.':'The competing labels describe materially different conditions; treating a telemetry gap as innocence, context as proof, or an operational prerequisite as satisfied would overstate the evidence.'}</p></div>`:''}`)).join('')+detectiveSealedCase()+card('Submit the consolidated casefile',`<p class="muted">Validation checks the entire casefile at once. Incorrect submissions do not reveal which individual selections need revision.</p><button onclick="detCheck()" ${detValidated||!detSealState.submitted?'disabled':''}>Validate complete investigation →</button>${detMessage?`<div class="feedback ${detValidated?'success':'warning'}" role="status"><b>${detValidated?'Investigation validated':'Reassessment required'}</b><p>${safe(detMessage)}</p></div>`:''}<p class="small muted">Validation attempts: ${detTries}</p>`)+card('Analyst investigation note',note('detnote','Which additional evidence would you request to determine authorization, scope, and operational impact?'))}

function caseChronology(i){if(i<5||i>10)return '';const rows=[['09:12','Authentication alert raised for SQ-WIN-17'],['09:15','Successful sign-in recorded; account ownership unverified'],['09:18','Privileged group membership change recorded; actor unknown'],['09:23','Endpoint telemetry gap recognized'],['09:29','Approved scanner context belongs to a separate asset'],['09:31','Distinct session/change references and parsing gap flagged']];const visible=i===5?1:i===6?5:6;return `<details class="soc-chronology"><summary>Case chronology • evidence available so far</summary><ul>${rows.slice(0,visible).map(r=>`<li><b>${r[0]}</b> — ${safe(r[1])}</li>`).join('')}</ul><p class="small muted">Times are simulated case timestamps; a recorded event is not necessarily proof of unauthorized activity.</p></details>`}
function render(){let b='';$('who').textContent=name||'Learner session';$('bar').style.width=((stage+1)/12*100)+'%';$('nav').innerHTML=stages.map((s,i)=>`<button class="${i===stage?'active':''}" onclick="jump(${i})"><span>${complete[i]?'✓':'○'}</span> <span class="navtext">${s}</span></button>`).join('');switch(stage){case 0:b=section('Welcome to Signal Quay','An instructor-led, evidence-driven simulation for emerging SOC analysts.',card('Identify your analyst session',`<p class="muted">You are joining the defensive operations team of a fictional regional shipping cooperative. Your instructor will guide you through one continuous case. No live Splunk connection is required.</p><label>Your name</label><input id="learner" placeholder="Enter learner name" value="${safe(name)}" oninput="name=this.value;$('who').textContent=name||'Learner session'"/><div class="grid"><div class="mini"><strong>01 / Operator</strong>Apply security operations practices.</div><div class="mini"><strong>02 / Detective</strong>Analyze evidence and detection readiness.</div><div class="mini"><strong>03 / Judge</strong>Defend an operational decision.</div></div>`));break;case 1:b=section('From preparation to practice','You have already completed Reporter → Translator prework.',card('What changes in class?',`<p>You have identified terms, explained core ideas, and connected concepts. Now you will <b>perform</b> an analyst’s duties, <b>analyze</b> competing explanations, and <b>evaluate</b> a defensible response.</p><div class="mini">Prior knowledge becomes workplace action: security posture → SOC monitoring → alert triage → SSE detection evaluation → evidence-based response.</div>`));break;case 2:b=section('Learning objectives','Use both source lessons as one connected professional workflow.',card('By the end of the simulation, you will be able to',`<div class="grid">${['Explain how people, processes, policies and technology support security posture.','Distinguish SOC analyst, engineer, architect and manager responsibilities.','Apply the incident triage workflow and differentiate incidents from unconfirmed alerts.','Interpret monitoring metrics and recognize operational tradeoffs.','Find and evaluate SSE use cases by category, data, journey stage, volume and SPL difficulty.','Assess detection prerequisites, data availability, known false positives and response guidance.','Explain how frameworks and analytic stories connect related detections.','Defend a proportionate response using evidence, uncertainties and team responsibilities.'].map((x,i)=>`<div class="mini"><strong>Objective ${i+1}</strong>${x}</div>`).join('')}</div>`));break;case 3:b=section('The Harbor Access Case','A suspicious access pattern has appeared during a scheduled infrastructure review.',card('Workplace mission briefing',`<p><b>Organization:</b> Signal Quay Cooperative operates cargo coordination and member-facing services. Its SOC receives a notable alert involving workstation SQ-WIN-17 and a local administrator account change. The security manager asks you to determine what can be supported by available evidence, identify appropriate detection content, and prepare a response recommendation.</p><div class="grid"><div class="mini"><strong>Operational concern</strong>Unnecessary disruption to shipping operations is costly; a real unauthorized administrator change also requires prompt investigation.</div><div class="mini"><strong>Available systems</strong>SIEM alerts, Windows Security events, approved scanning calendar, limited endpoint telemetry, and an SSE-style content catalog.</div><div class="mini"><strong>Important limitation</strong>All records are simulated for training. The initial alert does not by itself establish compromise.</div></div><details><summary>Stakeholder message</summary><p>“Please establish what happened, identify what remains unknown, and propose next steps. Keep the incident record accurate and involve the correct specialists.” — SOC Manager</p></details>`));break;case 4:b=section('Operator briefing','Apply the monitoring and security-content practices that make an investigation possible.',card('Your assigned responsibilities',`<p>First, route work to the right SOC roles. Then evaluate whether proposed detections are operationally ready. Your assignments will establish the working record used by the Detective.</p><div class="mini"><b>Monitoring cycle:</b> Define and predict → establish and architect → implement and collect → analyze and report → respond and review.</div><details><summary>Reference: detection readiness</summary><p>SSE presents a Security Data Journey, data-source prerequisites, deployment guidance, bookmark statuses and detection attributes. Confirm that the required data is available and that the detection works before treating it as deployment-ready.</p></details>`));break;case 5:b=section('Operator workbench','Create a usable operational record before interpreting the alert.',operatorWorkbench()+sqJourneyLab());break;case 6:b=section('Detective briefing','Your Operator record has established ownership and detection readiness; now investigate what the alert actually means.',card('Evidence arrives',`<p><b>09:12</b> — SIEM flags repeated authentication failures for SQ-WIN-17.<br><b>09:15</b> — A successful sign-in appears from an office IP.<br><b>09:18</b> — An administrator group membership change appears in Windows Security events.<br><b>09:23</b> — Endpoint telemetry from SQ-WIN-17 is incomplete.<br><b>09:29</b> — An approved scanner schedule explains a separate IDS port-scan alert.</p><div class="mini"><b>Investigative question:</b> Which events can be explained, which require corroboration, and what evidence is missing?</div><details><summary>Concept refresher</summary><p>Alert triage examines whether an actual incident occurred, whether it succeeded, what happened, whether other assets were affected, and how to respond. Threat hunting begins with a hypothesis and seeks activity automated detection may have missed.</p></details>`));break;case 7:b=section('Detective investigation desk','Reconstruct the event and distinguish confirmed findings from unresolved questions.',detectiveWorkbench()+sqAttackLab()+sqSplLab());break;case 8:b=section('Judge briefing','Your task is to weigh the evidence and operational constraints—not to treat every anomaly as a breach.',card('Decision criteria',`<p>Evaluate the <b>evidence quality</b>, <b>scope of impact</b>, <b>required detection data</b>, <b>risk of unnecessary disruption</b>, and <b>correct ownership</b> before recommending action.</p><div class="grid"><div class="mini"><strong>Confirmed</strong>A verified unauthorized administrator change would justify incident handling.</div><div class="mini"><strong>Unresolved</strong>Missing endpoint telemetry and uncertain account ownership require additional investigation.</div><div class="mini"><strong>Operational continuity</strong>Use proportionate safeguards and established response procedures; do not automatically disrupt unrelated systems.</div></div>`));break;case 9:b=section('Judge decision chamber','Review a contested case, reconcile competing operational constraints, and authorize a defensible response.',judgeWorkbench()+sqMetricsLab());break;case 10:b=section('Final debrief and reflection','Connect your work to security posture, monitoring, investigation and Splunk detection maturity.',card('What the mission demonstrates',`<div class="grid"><div class="mini"><strong>Operator • Apply</strong>Operational readiness depends on clear roles, available data, and reliable monitoring processes.</div><div class="mini"><strong>Detective • Analyze</strong>Different alerts can have different explanations. Missing evidence must remain visible in the record.</div><div class="mini"><strong>Judge • Evaluate</strong>Sound decisions account for evidence, uncertainty, business impact and the capabilities of the SOC.</div></div><p><b>Security operations measures:</b> MTTD concerns time to detect, MTTA time to acknowledge, MTTR time to respond, and dwell time the period a threat remains undetected. Metrics support improvements but do not replace the goal of preventing harm.</p><p><b>SSE connection:</b> Security Data Journey stages, filtered use cases, bookmarks, data onboarding, analytic stories and MITRE ATT&CK mappings help a SOC develop practical detections appropriate to its environment.</p>`)+sqStatus()+card('Reflection',note('reflection','What evidence changed your interpretation, and what would you examine first in a similar incident?')));break;case 11:b=section('Participation summary','A record of the activities completed during your instructor-led simulation.',card('Learner record',`<p><b>Name:</b> ${safe(name||'Not entered')}</p><p><b>Validated activity work products:</b> ${[handoffState.solved,detValidated,complete.judge,sqLab.validated.journey,sqLab.validated.attack,sqLab.validated.spl,sqLab.validated.metrics].filter(Boolean).length} of 7 core milestones &nbsp; • &nbsp; <b>Judge decision:</b> ${complete.judge?'Validated':'Not yet validated'}</p>${sqStatus()}<p><b>Practice attempts:</b> ${Object.values(attempts).reduce((a,b)=>a+b,0)}</p><p class="muted">Completion indicates participation in this simulated learning experience; it does not constitute a Splunk certification or live security incident record.</p><button onclick="window.print()">Print participation record</button><button class="secondary" onclick="downloadSummary()">Export notes</button>`));break} $('app').innerHTML=storylinePanel(stage)+caseChronology(stage)+b+foot()}

/* Judge Work: three-stage decision board, delayed explanations */
const judgeCases=[
{id:'disposition',title:'01 / Incident disposition hearing',brief:'The administrator change is recorded, but the actor is not verified. A separate IDS finding matches an authorized scan on another asset. The endpoint sensor has a telemetry gap.',facts:[['Privilege audit','Group membership change on SQ-WIN-17 at 09:18; actor attribution remains open.'],['Scan authorization','Approved scanning covers SQ-NET-08, not the workstation under review.'],['Coverage note','Windows audit survives; endpoint process telemetry is incomplete.']],question:'Choose the disposition the evidence supports.',options:[['close','Classify the change as provisionally authorized based on the nearby maintenance activity, with a follow-up owner review.'],['active','Keep the workstation finding open, correlate the change actor and approval trail, and reassess scope as evidence develops.'],['breach','Open a precautionary multi-host investigation while the team verifies whether the privilege change propagated.'],['hold','Preserve the host finding and prioritize restoring endpoint telemetry before issuing a formal disposition.']],correct:'active',proof:['Privilege audit','Scan authorization'],rationale:'The group change merits investigation, but its actor and authorization remain unresolved. The approved scan explains a different alert; incomplete endpoint telemetry is a limitation, not proof of compromise.',alternatives:'Closing conflates unrelated findings; declaring widespread compromise exceeds the evidence; waiting for one source ignores surviving audit records.'},
{id:'safeguards',title:'02 / Response authorization board',brief:'The cooperative needs cargo systems available. Investigators can retain logs, check the account owner, and use established account safeguards. No lateral spread has been established.',facts:[['Business impact','Broad host isolation may interrupt active cargo coordination.'],['Investigation plan','The analyst can preserve records and validate account-change authorization.'],['Scope review','No verified evidence currently connects other cargo hosts to the change.']],question:'Authorize the next operational package.',options:[['broad','Apply temporary access restrictions to connected cargo hosts until the account-change review establishes scope.'],['targeted','Preserve volatile and audit evidence, verify change authorization, and apply safeguards to exposure supported by the findings.'],['observe','Increase monitoring and shorten review intervals, reserving disruptive controls until another signal corroborates the finding.'],['reset','Rotate shared privileged credentials on potentially connected systems to reduce the risk of unobserved reuse.']],correct:'targeted',proof:['Business impact','Investigation plan'],rationale:'Evidence preservation and authorization checks can proceed promptly, with safeguards proportionate to the verified scope. Escalation remains available if corroborating evidence emerges.',alternatives:'Broad isolation and universal resets exceed the demonstrated scope; passive monitoring alone leaves a material finding unresolved.'},
{id:'release',title:'03 / Detection release tribunal',brief:'A privileged-access search returns events, but its normalized user field is empty. Raw Windows events contain the principal. A separate cloud feed has not been onboarded.',facts:[['Raw event','The privileged-access event contains principal=svc-dock.'],['Search output','The normalized user field is null, although events are returned.'],['Release condition','The analytic joins records using the normalized user field.']],question:'Choose the release decision.',options:[['release','Release to a monitored pilot with a documented identity-join exception and daily review of unmatched events.'],['tune','Rebaseline the analytic on representative events and tune its thresholds before production acceptance.'],['repair','Repair normalized identity extraction, verify the join against representative records, and then reconsider release.'],['cloud','Delay the release until cloud authentication telemetry is available for broader identity correlation.']],correct:'repair',proof:['Search output','Release condition'],rationale:'The detection depends on a normalized identity field that is currently missing. Parsing and representative validation must be completed before reliable release.',alternatives:'An exception does not fix unreliable joins; alert-frequency tuning cannot restore identity; the separate cloud source is not the stated prerequisite.'}
];
const judgeState={choices:{},proof:{},committed:{},reviewed:{},errors:'',passed:false};
const judgeOrders=Object.fromEntries(judgeCases.map((q,i)=>[q.id,detShuffle(q.options)]));
function judgeChoose(id,v){if(judgeState.passed)return;judgeState.choices[id]=v;delete judgeState.committed[id];judgeState.errors='';render()}
function judgeProof(id,v){if(judgeState.passed)return;let a=judgeState.proof[id]||[];judgeState.proof[id]=a.includes(v)?a.filter(x=>x!==v):[...a,v];delete judgeState.committed[id];judgeState.errors='';render()}
function judgeRecord(id){let st=judgeState;let panel=document.querySelector('main');let y=panel?panel.scrollTop:0;if(!st.choices[id]||(st.proof[id]||[]).length!==2){st.errors='Select a disposition and exactly two supporting records before recording this hearing.';render();if(panel)panel.scrollTop=y;return;}st.committed[id]=true;st.errors='';render();if(panel)panel.scrollTop=y;}
function judgeValidate(){attempts['judge-board']=(attempts['judge-board']||0)+1;let st=judgeState;
if(judgeCases.some(q=>!st.choices[q.id]||(st.proof[q.id]||[]).length!==2||!st.committed[q.id])){st.errors='The decision package is incomplete. Each hearing requires a disposition, two supporting records, and a recorded decision.'}
else if(judgeCases.every(q=>st.choices[q.id]===q.correct&&q.proof.every(x=>st.proof[q.id].includes(x)))){st.passed=true;complete.judge=true;st.errors='Decision package validated. Expert analysis is now available for every hearing.'}
else{st.errors='The consolidated review requires revision. Re-examine attribution, scope, and operational prerequisites. No individual correct or incorrect answer is identified.';st.committed={}}
render()
}

/* Judge phase: three sealed authorization orders */
const judgeSeals=[
{id:'scope',title:'Seal I / The borrowed authority',riddle:'Three records agree that something happened; none agrees on who caused it. One timestamp aligns, one asset does not, and one identity appears without a verified link to the change. The manager must sign a disposition that will remain defensible if later evidence contradicts current assumptions. What precisely may the order assert—and what must it leave unresolved?',options:[['review','Maintain a narrowly scoped investigation and obtain independent actor attribution and change approval evidence.'],['close','Treat the change as provisionally expected based on the maintenance context, subject to owner confirmation.'],['expand','Expand the inquiry to adjacent assets as a precaution while checking for shared privileged-account activity.'],['defer','Keep the finding in evidence-preservation status until the endpoint sensor gap can be reconstructed.']],correct:'review',evidence:['Privilege audit','Scan authorization'],why:'The audit establishes a change but not its actor or authorization. The separate scanning record does not authorize the workstation change. A scoped finding allows targeted corroboration without assuming compromise or routine maintenance.',wrong:'A shared time window does not establish authorization. Neither broad incident scope nor waiting for endpoint recovery is established by the records.'},
{id:'guardrail',title:'Seal II / The safeguard paradox',riddle:'Two signatures are requested before the night shift: one would protect operations by limiting disruption; the other would protect the investigation by preserving what may disappear. Neither signature can rely on an unproven chain of affected hosts. Determine the narrowest defensible authority that satisfies both obligations, and identify the assumption that would make a broader order premature.',options:[['limit','Preserve relevant audit evidence, verify authorization promptly, and limit safeguards to demonstrated exposure.'],['restrict','Temporarily constrain access from adjacent systems to reduce potential propagation during attribution.'],['watch','Increase detection sensitivity and monitoring cadence while awaiting independent confirmation.'],['rotate','Initiate coordinated privileged credential rotation across related operational services.']],correct:'limit',evidence:['Business impact','Investigation plan'],why:'Preserving records and validating authorization are supported now. Additional safeguards should be proportionate to verified exposure and can be broadened as evidence changes.',wrong:'Adjacent-host restrictions and environment-wide rotation assume unverified scope. Surveillance without evidence preservation leaves the investigation exposed.'},
{id:'release',title:'Seal III / The unnamed witness',riddle:'The monitoring board shows a healthy event count, the source record carries an identity, and the analytic relationship between events still fails. Elsewhere, another feed is absent and another team offers to reduce noise. The release officer may authorize only a detection whose decisive relationship can actually be evaluated. Which hidden break prevents that authorization, despite the reassuring indicators?',options:[['parse','Repair the normalized identity field, retest the analytic join, and document acceptance evidence.'],['except','Authorize a monitored release with a documented exception and manual review of unmatched events.'],['volume','Run a production-like alert-volume baseline and tune thresholds before authorizing release.'],['source','Wait for cloud identity ingestion so the detection can be validated against a broader account timeline.']],correct:'parse',evidence:['Search output','Release condition'],why:'The analytic joins on the normalized user field, which is null. Raw principal availability does not repair the failed extraction. The cloud source is not a dependency of this Windows detection.',wrong:'A documented exception does not restore a required join; alert-volume changes do not repair extraction; the cloud-feed issue concerns a different detection.'}
];
const judgeSealState={answers:{},proof:{},opened:{},submitted:false,feedback:''};
const judgeSealOrder=Object.fromEntries(judgeSeals.map(q=>[q.id,detShuffle(q.options)]));
function judgeSealPick(id,v){if(judgeState.passed)return;judgeSealState.answers[id]=v;judgeSealState.feedback='';render()}
function judgeSealProof(id,v){if(judgeState.passed)return;let a=judgeSealState.proof[id]||[];judgeSealState.proof[id]=a.includes(v)?a.filter(x=>x!==v):[...a,v];judgeSealState.feedback='';render()}
function judgeSealOpen(id){judgeSealState.opened[id]=!judgeSealState.opened[id];render()}
function judgeSealValidate(){
attempts['judge-sealed']=(attempts['judge-sealed']||0)+1;
const st=judgeSealState;
if(judgeCases.some(q=>!judgeState.committed[q.id])){st.feedback='Record a decision in each preliminary hearing before submitting the sealed authorization orders.'}
else if(judgeSeals.some(q=>!st.answers[q.id]||(st.proof[q.id]||[]).length!==2)){st.feedback='The authorization package is incomplete. Each seal needs a decision and exactly two supporting records.'}
else if(judgeSeals.every(q=>st.answers[q.id]===q.correct&&q.evidence.every(x=>st.proof[q.id].includes(x)))&&judgeCases.every(q=>judgeState.choices[q.id]===q.correct&&q.proof.every(x=>(judgeState.proof[q.id]||[]).includes(x)))){
judgeState.passed=true;complete.judge=true;st.feedback='All three sealed orders and preliminary hearings have passed consolidated validation. Expert explanations are now available.'
}else{st.feedback='Consolidated review requires revision. Compare the source, authorization, scope, and release prerequisites across the complete case. This message does not identify any correct or incorrect individual selection.'}
render()
}
function judgeWorkbench(){
let st=judgeState,seal=judgeSealState;
return `<div class="op-command"><span class="op-live">● SOC AUTHORIZATION DESK / SIMULATED</span><h2>The Three Sealed Orders</h2><p>As the Judge, you must decide what the SOC may declare, what it may authorize, and what it may release. The preliminary hearings produce an evidence record. The sealed orders test whether those decisions withstand conflicting information. Neither stage discloses correctness until the entire authorization package is validated.</p><div class="op-overview">${judgeCases.map(q=>`<div><b>${q.title.slice(0,2)}</b><span>${st.committed[q.id]?'Recorded':'Pending'}</span></div>`).join('')}</div></div>`
+judgeCases.map(q=>card(q.title,`<p class="muted">${q.brief}</p><h3>${q.question}</h3><div class="op-options">${judgeOrders[q.id].map(o=>`<button class="op-option ${st.choices[q.id]===o[0]?'op-picked':''}" ${st.passed?'disabled':''} onclick="judgeChoose('${q.id}','${o[0]}')">${o[1]}</button>`).join('')}</div><label>Select two records to support this preliminary ruling</label><div class="row">${q.facts.map(f=>`<button class="${(st.proof[q.id]||[]).includes(f[0])?'':'secondary'}" ${st.passed?'disabled':''} onclick="judgeProof('${q.id}','${f[0]}')">${(st.proof[q.id]||[]).includes(f[0])?'✓ ':''}${f[0]}</button>`).join('')}</div><p class="small muted">${(st.proof[q.id]||[]).length}/2 records attached</p><button ${st.passed?'disabled':''} onclick="judgeRecord('${q.id}')">Update recorded decision</button>${st.committed[q.id]?`<div class="feedback" role="status"><b>Decision recorded.</b> Your current disposition and two supporting records have been saved for consolidated review. This confirmation appears regardless of whether your selections are correct or incorrect.</div>`:`<p class="small muted">Select a disposition and exactly two supporting records, then record your decision. Recording does not disclose correctness.</p>`}${st.errors?`<div class="feedback warning" role="status">${st.errors}</div>`:''}${st.passed?`<div class="feedback success"><b>Expert analysis:</b> ${q.rationale}<p><b>Why alternatives fail:</b> ${q.alternatives}</p></div>`:''}`)).join('')
+card('Judicial evidence docket',`<p class="muted">Open each record to inspect its scope and limitations. A record can be genuine but irrelevant to a particular authorization.</p><div class="grid">${judgeCases.flatMap(q=>q.facts).map((f,i)=>`<div class="mini"><strong>${f[0]}</strong><button class="secondary" onclick="judgeSealOpen('${i}')">${seal.opened[i]?'Hide record':'Inspect record'}</button>${seal.opened[i]?`<p class="small">${f[1]}</p>`:''}</div>`).join('')}</div>`)
+card('Judge final challenge / The Three Sealed Orders',`<p class="muted">Read all three orders as a single decision. Each riddle asks you to infer a limit on the SOC’s authority from evidence across the docket. Beware: a true record may support the wrong case, and a reasonable action may still exceed the documented scope. Choose a ruling and two records for each. No individual correctness indicators appear before all three orders pass.</p>${judgeSeals.map(q=>`<div class="item"><h3>${q.title}</h3><p>${q.riddle}</p><div class="op-options">${judgeSealOrder[q.id].map(o=>`<button class="op-option ${seal.answers[q.id]===o[0]?'op-picked':''}" ${st.passed?'disabled':''} onclick="judgeSealPick('${q.id}','${o[0]}')">${o[1]}</button>`).join('')}</div><label>Attach two records that establish your authority to make this ruling</label><div class="row">${judgeCases.flatMap(c=>c.facts).map(f=>`<button class="${(seal.proof[q.id]||[]).includes(f[0])?'':'secondary'}" ${st.passed?'disabled':''} onclick="judgeSealProof('${q.id}','${f[0]}')">${(seal.proof[q.id]||[]).includes(f[0])?'✓ ':''}${f[0]}</button>`).join('')}</div><p class="small muted">${(seal.proof[q.id]||[]).length}/2 records attached</p>${st.passed?`<div class="feedback success"><b>Expert rationale:</b> ${q.why}<p><b>Why the other rulings do not fit:</b> ${q.wrong}</p></div>`:''}</div>`).join('')}<button ${st.passed?'disabled':''} onclick="judgeSealValidate()">Validate all three sealed orders →</button>${seal.feedback?`<div class="feedback ${st.passed?'success':'warning'}" role="status">${seal.feedback}</div>`:''}`)
+card('Final recommendation memo',note('judgenote','State the case disposition, scope of authorization, detection release decision, unresolved facts, and the SOC roles responsible.'));
}
function judgeCheck(){if(answers.response==='1'&&answers.detection==='2'&&answers.ownership==='0'){complete.judge=true;render()}else $('judgeResult').innerHTML='<div class="feedback warning"><b>Revise your decision.</b> Compare your choices with the known evidence, detection prerequisites, and SOC role boundaries. The correct response will be explained after all decisions are validated.</div>'}function downloadSummary(){let text=`Signal Quay Participation Summary\nLearner: ${name}\nOperator handoff: ${handoffState.solved?'Validated':'Pending'}\nDetective: ${detValidated?'Validated':'Pending'}\nSecurity Data Journey: ${sqLab.validated.journey?'Validated':'Pending'}\nATT&CK: ${sqLab.validated.attack?'Validated':'Pending'}\nSPL evidence: ${sqLab.validated.spl?'Located':'Pending'}\nSOC metrics: ${sqLab.validated.metrics?'Validated':'Pending'}\nJudge: ${complete.judge?'Validated':'Not validated'}\n\n`+Object.entries(notes).map(([k,v])=>`${k}: ${v}`).join('\n\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download='signal-quay-participation.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();</script></body></html>
